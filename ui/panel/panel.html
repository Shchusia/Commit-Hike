<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Hike</title>
<style>
/*
 * Shared by the VS Code webview and the JetBrains JCEF tool window.
 * Data comes from the host: {type, state, error, repo, locale, status (core protocol v1), avatar, avatar_custom}.
 * Colors come from the host theme: VS Code provides --vscode-* variables,
 * the JetBrains host injects --jb-* variables on :root.
 */
:root {
  --ct-bg: var(--vscode-sideBar-background, var(--jb-bg, #1e1f22));
  --ct-fg: var(--vscode-foreground, var(--jb-fg, #cfd1d6));
  --ct-muted: var(--vscode-descriptionForeground, var(--jb-muted, #8c8f96));
  --ct-line: var(--vscode-widget-border, var(--vscode-panel-border, var(--jb-border, #3a3c42)));
  --ct-link: var(--vscode-textLink-foreground, var(--jb-link, #6ea6ff));
  --ct-btn-bg: var(--vscode-button-background, var(--jb-btn-bg, #3574f0));
  --ct-btn-fg: var(--vscode-button-foreground, var(--jb-btn-fg, #ffffff));
  --ct-btn-hover: var(--vscode-button-hoverBackground, var(--jb-btn-hover, #4682fa));
  --ct-focus: var(--vscode-focusBorder, var(--jb-focus, #3574f0));
  --ct-font: var(--vscode-font-family, var(--jb-font, system-ui, sans-serif));
  --ct-size: var(--vscode-font-size, var(--jb-font-size, 13px));
  /* trail-blaze paint: the one accent of the panel */
  --ct-blaze: #e8b53d;
  --ct-blaze-ink: #3b2a05;
}
body.vscode-light, body[data-theme="light"] { --ct-blaze: #c98a00; --ct-blaze-ink: #fff8e6; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ct-bg);
  color: var(--ct-fg);
  font-family: var(--ct-font);
  font-size: var(--ct-size);
  line-height: 1.45;
  padding: 14px 16px 20px;
  max-width: 520px;
}
button { font: inherit; }
button:focus-visible, [role="tab"]:focus-visible { outline: 1px solid var(--ct-focus); outline-offset: 2px; }


h1 { font-size: 1.35em; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.distance { margin: 2px 0 0; color: var(--ct-muted); font-variant-numeric: tabular-nums; }
.distance strong { color: var(--ct-fg); font-weight: 600; }

/* ---- map palette: a hiking topo map, tuned per theme ---- */
:root {
  --map-paper: #1f2623; --map-ink: #c9d1c9; --map-halo: #1f2623;
  --map-forest: #2c4634; --map-tree: #4f7f5b; --map-meadow: #34432f; --map-grass: #6d8a58;
  --map-rock: #3e3f3e; --map-rock-ink: #767872; --map-snow: #4a5157; --map-water: #24435b; --map-water-ink: #5f95c0;
  --map-village: #4a4238; --map-contour: rgba(214, 178, 120, .28); --map-ahead: rgba(232, 181, 61, .55);
}
body.vscode-light, body[data-theme="light"] {
  --map-paper: #e8eee3; --map-ink: #2e3a31; --map-halo: #e8eee3;
  --map-forest: #c6dcbc; --map-tree: #5e9160; --map-meadow: #dce7cc; --map-grass: #93b27a;
  --map-rock: #dad8d2; --map-rock-ink: #8f8a80; --map-snow: #f3f6f8; --map-water: #b9d6ea; --map-water-ink: #5b8fb9;
  --map-village: #e2d8c8; --map-contour: rgba(160, 120, 70, .38); --map-ahead: rgba(201, 138, 0, .6);
}
.map { display: block; width: 100%; height: auto; margin: 10px 0 8px; border-radius: 3px; background: var(--map-paper); }
.map .band { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.map .contour { fill: none; stroke: var(--map-contour); stroke-width: 1; }
.map .tree { fill: var(--map-tree); }
.map .grass { fill: none; stroke: var(--map-grass); stroke-width: 1; stroke-linecap: round; }
.map .rock { fill: none; stroke: var(--map-rock-ink); stroke-width: 1; }
.map .lake { fill: var(--map-water); stroke: var(--map-water-ink); stroke-width: 1; }
.map .house { fill: var(--map-rock-ink); }
.map .ahead { fill: none; stroke: var(--map-ahead); stroke-width: 2.5; stroke-dasharray: 7 5; stroke-linecap: round; }
.map .walked { fill: none; stroke: var(--ct-blaze); stroke-width: 4; stroke-linecap: round; }
.map .sym { stroke: var(--map-ink); stroke-width: 1.4; fill: var(--map-paper); stroke-linejoin: round; }
.map .sym.passed { fill: var(--ct-blaze); stroke: var(--ct-blaze-ink); }
.map .label { fill: var(--map-ink); font-size: 11.5px; paint-order: stroke; stroke: var(--map-halo); stroke-width: 3.5px; stroke-linejoin: round; }
.map .label .elev { font-size: 10px; opacity: .75; }
.map .label.upcoming { opacity: .75; }
.map .hiker { fill: var(--map-ink); stroke: var(--map-paper); stroke-width: 2.5; }
.map .hiker-ring { fill: none; stroke: var(--ct-blaze); stroke-width: 2.5; }
.map .scale line { stroke: var(--map-ink); stroke-width: 1.5; }
.map .scale text, .map .north text { fill: var(--map-ink); font-size: 10px; }
.map .north path { fill: var(--map-ink); }

.views { display: flex; gap: 2px; margin: 14px 0 4px; padding: 2px; border-radius: 4px; background: color-mix(in srgb, var(--ct-fg) 7%, transparent); }
.views button { flex: 1; background: none; border: 0; border-radius: 3px; padding: 4px 6px; color: var(--ct-muted); cursor: pointer; }
.views button[aria-selected="true"] { background: var(--ct-bg); color: var(--ct-fg); box-shadow: 0 0 0 1px var(--ct-line); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.scope { background: none; border: 0; color: var(--ct-link); cursor: pointer; padding: 0; white-space: nowrap; }

/* ---- journey: side-view scene, like looking at the hiker from the valley ---- */
.hike { margin: 12px 0 0; border-radius: 4px; overflow: hidden; background: #0b0e12; color: #e8e4da; }
.scene { position: relative; height: 250px; cursor: grab; outline: none; touch-action: pan-y; }
.scene:focus-visible { box-shadow: inset 0 0 0 2px var(--ct-focus); }
.scene.dragging { cursor: grabbing; }
.scene canvas { display: block; width: 100%; height: 100%; }
.recenter { position: absolute; right: 8px; top: 8px; border: 0; border-radius: 12px; padding: 3px 9px;
  background: rgba(11, 14, 18, .65); color: #e8e4da; font: inherit; font-size: .9em; cursor: pointer; }
.recenter[hidden] { display: none; }
.hike-info { padding: 4px 16px 18px; text-align: center; font-family: Georgia, "DejaVu Serif", "Times New Roman", serif; }
.hike-info .day { font-size: 1.15em; letter-spacing: .02em; }
.hike-info .big { font-size: 3.1em; line-height: 1.05; color: var(--ct-blaze); font-variant-numeric: oldstyle-nums; margin-top: 4px; }
.hike-info .unit { color: var(--ct-blaze); letter-spacing: .08em; font-variant: small-caps; }
.hike-info .place { margin-top: 14px; color: #a9b1b8; font-variant: small-caps; letter-spacing: .04em; }
.hike-info .flavor { font-style: italic; margin-top: 2px; font-size: 1.05em; }
.hike-info .next { margin-top: 12px; color: #8d959c; font-family: var(--ct-font); font-size: .92em; }
.hint { color: var(--ct-muted); font-size: .9em; margin: 6px 0 0; }

/* places list */
.places { list-style: none; margin: 12px 0 0; padding: 0; position: relative; }
.places::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; border-left: 2px dashed var(--ct-line); }
.places li { position: relative; padding: 0 0 12px 24px; }
.places li .dot { position: absolute; left: 1px; top: 3px; width: 10px; height: 14px; border-radius: 1px; background: var(--ct-bg); border: 1.5px solid var(--ct-muted); }
.places li.passed .dot { background: var(--ct-blaze); border-color: var(--ct-blaze); }
.places li.here .dot { width: 12px; height: 12px; left: 0; border-radius: 50%; border: 3px solid var(--ct-blaze); background: var(--ct-fg); }
.places .row { display: flex; justify-content: space-between; gap: 8px; }
.places .nm { font-weight: 600; }
.places li:not(.passed):not(.here) .nm { font-weight: 400; }
.places .meta { color: var(--ct-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.places .txt { color: var(--ct-muted); font-size: .92em; margin-top: 1px; }
.places li.here { color: var(--ct-blaze); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 4px; }
.stat .v { font-size: 1.35em; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .k { color: var(--ct-muted); font-size: .92em; }
.chart { display: block; width: 100%; height: auto; margin-top: 14px; }
.chart .bar { fill: color-mix(in srgb, var(--ct-fg) 28%, transparent); }
.chart .bar.today { fill: var(--ct-blaze); }
.chart .base { stroke: var(--ct-line); }
.chart text { fill: var(--ct-muted); font-size: 10px; }
.chart-title { margin: 16px 0 0; font-weight: 600; }
.chart-title span { color: var(--ct-muted); font-weight: 400; }
.hint { color: var(--ct-muted); margin: 6px 0 0; }

.facts { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
.facts dt { color: var(--ct-muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }

.postcard {
  margin: 16px 0 0; padding: 10px 12px;
  border-left: 3px solid var(--ct-blaze);
  background: color-mix(in srgb, var(--ct-blaze) 8%, transparent);
}
.postcard p { margin: 0; }
.postcard .from { color: var(--ct-muted); font-size: .92em; margin-top: 2px; }

.actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.primary {
  background: var(--ct-btn-bg); color: var(--ct-btn-fg); border: 0; border-radius: 2px;
  padding: 5px 12px; cursor: pointer;
}
.primary:hover { background: var(--ct-btn-hover); }
.link { background: none; border: 0; padding: 0; color: var(--ct-link); cursor: pointer; }
.link:hover { text-decoration: underline; }

.achievements { margin: 18px 0 0; }
.achievements h2 { font-size: 1em; font-weight: 600; margin: 0 0 6px; }
.achievements h2 span { color: var(--ct-muted); font-weight: 400; }
.achievements ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.achievements li { display: grid; grid-template-columns: 10px 1fr; gap: 0 10px; align-items: start; }
.achievements .mark { width: 7px; height: 14px; margin-top: 2px; border-radius: 1px; border: 1.5px solid var(--ct-muted); }
.achievements .got .mark { background: var(--ct-blaze); border-color: var(--ct-blaze); }
.achievements .name { font-weight: 600; }
.achievements li:not(.got) .name { font-weight: 400; color: var(--ct-muted); }
.achievements .desc { grid-column: 2; color: var(--ct-muted); font-size: .92em; }
.empty { padding: 18px 0 4px; }
.empty h1 { margin-bottom: 6px; }
.empty p { margin: 0 0 14px; color: var(--ct-muted); max-width: 36em; }
.finished { color: var(--ct-blaze); font-weight: 600; }
</style>
</head>
<body>
<main id="root"><p class="distance">…</p></main>

<script nonce="{{NONCE}}">
(function () {
  "use strict";

  // ---------------------------------------------------------------- strings
  // UI text only; route names and stories come translated from the core.
  const STRINGS = {
    en: {
      scopeAll: "All projects", scopeProject: "This project",
      viewJourney: "Hike", viewMap: "Map", viewPlaces: "Places", viewStats: "Stats",
      dayN: "Day {n}", kmWord: { one: "kilometer", other: "kilometers" }, mWord: { one: "meter", other: "meters" },
      startPlace: "Setting out", backToHiker: "Back to the hiker", scrollHint: "Mouse wheel, drag or ← → to look along the trail",
      changeIcon: "Change hiker icon", resetIcon: "Default icon",
      setupTitle: "Turn commits into a journey",
      setupText: "Every commit you make moves you along a trail. Nothing is written to your projects and nothing leaves this computer.",
      setupBtn: "Set up Commit Hike",
      errorTitle: "Commit Hike couldn't read your progress", unknownError: "Unknown error.", retry: "Try again",
      notCountedTitle: "This project isn't counted",
      notCountedText: "Your settings count only the projects you choose. Commits here won't move you forward until you add it.",
      countBtn: "Count this project",
      noProjectTitle: "No journey for this project yet",
      noProjectText: "Give this project its own trail. Your commits here will still count toward your main journey.",
      chooseTrail: "Choose a trail", noTrailTitle: "No trail selected", noTrailText: "Pick a trail to start walking.",
      completed: "Trail completed", nextStop: "Next stop", nextIn: "{name}, in {d}",
      here: "You are here", left: "{d} to go", passedAt: "at {d}",
      today: "Today", streak: "Streak", onTrail: "On this trail", commits: "Commits",
      days: { one: "{n} day", other: "{n} days" }, lastDays: "Last 14 days", noActivity: "No commits in the last two weeks yet.",
      achievements: "Achievements", achCount: "{n} of {m}", secret: "Secret achievement",
      startNew: "Start a new trail", changeTrail: "Change trail", m: "m", km: "km", decimal: ".",
    },
    uk: {
      scopeAll: "Усі проєкти", scopeProject: "Цей проєкт",
      viewJourney: "Похід", viewMap: "Карта", viewPlaces: "Місця", viewStats: "Статистика",
      dayN: "День {n}", kmWord: { one: "кілометр", few: "кілометри", many: "кілометрів", other: "кілометра" },
      mWord: { one: "метр", few: "метри", many: "метрів", other: "метра" },
      startPlace: "Вирушаємо", backToHiker: "До мандрівника", scrollHint: "Коліщатко миші, перетягування або ← → щоб роздивитися стежку",
      changeIcon: "Змінити іконку", resetIcon: "Стандартна іконка",
      setupTitle: "Перетвори коміти на подорож",
      setupText: "Кожен твій коміт просуває тебе стежкою. У твої проєкти нічого не записується, і нічого не залишає цей комп'ютер.",
      setupBtn: "Налаштувати Commit Hike",
      errorTitle: "Commit Hike не зміг прочитати прогрес", unknownError: "Невідома помилка.", retry: "Спробувати ще раз",
      notCountedTitle: "Цей проєкт не враховується",
      notCountedText: "За твоїми налаштуваннями враховуються лише вибрані проєкти. Коміти тут не просуватимуть тебе, доки ти його не додаси.",
      countBtn: "Враховувати цей проєкт",
      noProjectTitle: "Для цього проєкту ще немає маршруту",
      noProjectText: "Дай цьому проєкту власну стежку. Коміти тут і далі рахуватимуться в основну подорож.",
      chooseTrail: "Вибрати стежку", noTrailTitle: "Стежку не вибрано", noTrailText: "Вибери стежку, щоб вирушити.",
      completed: "Стежку пройдено", nextStop: "Наступна зупинка", nextIn: "{name}, через {d}",
      here: "Ти тут", left: "ще {d}", passedAt: "на {d}",
      today: "Сьогодні", streak: "Серія", onTrail: "На цій стежці", commits: "Комітів",
      days: { one: "{n} день", few: "{n} дні", many: "{n} днів", other: "{n} дня" },
      lastDays: "Останні 14 днів", noActivity: "За останні два тижні комітів ще не було.",
      achievements: "Досягнення", achCount: "{n} з {m}", secret: "Таємне досягнення",
      startNew: "Почати нову стежку", changeTrail: "Змінити стежку", m: "м", km: "км", decimal: ",",
    },
  };
  let lang = "en";
  function t(key, vars) {
    let s = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
    for (const k in vars || {}) s = s.replace("{" + k + "}", vars[k]);
    return s;
  }
  function plural(key, n, fractionDigits) {
    const forms = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key];
    // Visible decimals change the form: "6 кілометрів" but "6,0 кілометра".
    const rules = new Intl.PluralRules(lang, { minimumFractionDigits: fractionDigits || 0 });
    return (forms[rules.select(n)] || forms.other).replace("{n}", n);
  }
  function pickLang(tag) {
    const base = String(tag || "en").toLowerCase().split(/[-_]/)[0];
    return STRINGS[base] ? base : "en";
  }
  function fmt(m) {
    if (m < 1000) return Math.round(m) + " " + t("m");
    const km = m / 1000;
    return (km < 100 ? km.toFixed(1).replace(".", t("decimal")) : String(Math.round(km))) + " " + t("km");
  }

  // ---------------------------------------------------------------- host bridge
  const vscode = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
  function send(msg) {
    if (vscode) vscode.postMessage(msg);
    else if (window.commitHikeHost) window.commitHikeHost.send(JSON.stringify(msg));
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.getElementById("root");
  let data = null;
  let scope = "global";
  let view = "journey";
  const lastDrawn = {}; // scope:route -> distance, so only real progress animates

  const SVG_TAGS = ["svg", "path", "rect", "circle", "text", "tspan", "g", "line", "title", "polygon", "ellipse"];
  function el(tag, attrs, children) {
    const n = SVG_TAGS.includes(tag) ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
    for (const k in attrs || {}) {
      if (attrs[k] == null) continue;
      if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => c && n.appendChild(c));
    return n;
  }

  // ---------------------------------------------------------------- map geometry
  function seeded(str) {
    let h = 2166136261;
    for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return ((h >>> 0) % 10000) / 10000; };
  }
  // A winding trail from bottom (start) to top (finish), same for the same route.
  function trailPath(id, W, H) {
    const rnd = seeded(id + ":path");
    const n = 7, pts = [];
    for (let i = 0; i <= n; i++) {
      const y = H - 26 - (H - 52) * (i / n);
      const side = i % 2 === 0 ? -1 : 1;
      const x = W / 2 + side * (W * 0.1 + rnd() * W * 0.13);
      pts.push([i === 0 || i === n ? W / 2 + side * W * 0.05 : x, y]);
    }
    let d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += " C" + [c1, c2, p2].map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    }
    return d;
  }
  // Wobbly closed ring for contour lines and lakes.
  function blob(cx, cy, r, rnd, wobble, points) {
    const k = points || 10, pts = [];
    for (let i = 0; i < k; i++) {
      const a = (i / k) * Math.PI * 2, rr = r * (1 - wobble / 2 + rnd() * wobble);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.8]);
    }
    let d = "";
    for (let i = 0; i < k; i++) {
      const p0 = pts[(i - 1 + k) % k], p1 = pts[i], p2 = pts[(i + 1) % k], p3 = pts[(i + 2) % k];
      if (i === 0) d += "M" + p1[0].toFixed(1) + "," + p1[1].toFixed(1);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += " C" + [c1, c2, p2].map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    }
    return d + "Z";
  }
  const BIOME_FILL = { forest: "--map-forest", meadow: "--map-meadow", rock: "--map-rock", snow: "--map-snow", water: "--map-water", village: "--map-village" };

  // Cartographic symbols, centred on (x, y).
  function symbol(kind, x, y, cls) {
    switch (kind) {
      case "peak": case "finish":
        return kind === "finish"
          ? el("g", { class: cls }, [el("path", { d: `M${x - 1},${y + 7} L${x - 1},${y - 8}`, "stroke-width": 1.6 }),
              el("path", { d: `M${x - 1},${y - 8} L${x + 8},${y - 5} L${x - 1},${y - 2} Z` })])
          : el("path", { class: cls, d: `M${x},${y - 7} L${x + 7},${y + 5} L${x - 7},${y + 5} Z` });
      case "hut": case "village":
        return el("path", { class: cls, d: `M${x - 6},${y + 5} L${x - 6},${y - 1} L${x},${y - 7} L${x + 6},${y - 1} L${x + 6},${y + 5} Z` });
      case "lake": case "river":
        return el("path", { class: cls, d: `M${x - 7},${y} q3.5,-4 7,0 t7,0 M${x - 7},${y + 4} q3.5,-4 7,0 t7,0`, fill: "none" });
      case "bridge":
        return el("path", { class: cls, d: `M${x - 7},${y - 5} q4,5 0,10 M${x + 7},${y - 5} q-4,5 0,10 M${x - 5},${y - 2} L${x + 5},${y - 2} M${x - 5},${y + 2} L${x + 5},${y + 2}`, fill: "none" });
      case "pass":
        return el("path", { class: cls, d: `M${x - 7},${y + 4} q7,-12 14,0`, fill: "none" });
      case "start":
        return el("circle", { class: cls, cx: x, cy: y, r: 5.5 });
      default: // landmark and anything a newer core may send
        return el("path", { class: cls, d: `M${x},${y - 6} L${x + 6},${y} L${x},${y + 6} L${x - 6},${y} Z` });
    }
  }

  function drawMap(j) {
    const route = j.route, W = 300, H = 440;
    const svg = el("svg", { class: "map", viewBox: `0 0 ${W} ${H}`, role: "img",
      "aria-label": route.name + ": " + fmt(j.distance_m) + " / " + fmt(route.length_m) });
    const d = trailPath(route.id, W, H);
    const probe = el("path", { d, fill: "none", stroke: "none" });
    svg.append(probe);
    root.appendChild(svg); // must be in the DOM to measure
    const L = probe.getTotalLength();
    const at = f => probe.getPointAtLength(Math.max(0, Math.min(1, f)) * L);
    const rnd = seeded(route.id + ":terrain");
    const layers = { terrain: el("g"), deco: el("g"), contours: el("g"), trail: el("g"), marks: el("g"), labels: el("g") };

    // Terrain zones: wide soft bands along the trail, one per biome segment.
    const biomes = (route.biomes && route.biomes.length ? route.biomes : [{ at_m: 0, type: "meadow" }]);
    biomes.forEach((b, i) => {
      const from = b.at_m / route.length_m, to = (biomes[i + 1] ? biomes[i + 1].at_m : route.length_m) / route.length_m;
      if (to <= from) return;
      let seg = "";
      for (let k = 0; k <= 24; k++) {
        const p = at(from + (to - from) * (k / 24));
        seg += (k ? " L" : "M") + p.x.toFixed(1) + "," + p.y.toFixed(1);
      }
      const color = `var(${BIOME_FILL[b.type] || "--map-meadow"})`;
      layers.terrain.append(el("path", { class: "band", d: seg, stroke: color, "stroke-width": 150, opacity: 0.55 }));
      layers.terrain.append(el("path", { class: "band", d: seg, stroke: color, "stroke-width": 90, opacity: 0.8 }));

      // Scatter symbols for this terrain near, but not on, the trail;
      // density is per pixel of trail so short forest stretches still look like forest.
      const perPx = { forest: 1 / 7, meadow: 1 / 16, rock: 1 / 14, snow: 1 / 22, village: 1 / 12, water: 1 / 12 }[b.type] || 1 / 16;
      const count = Math.round(L * (to - from) * perPx) + 2;
      for (let k = 0; k < count; k++) {
        const f = from + (to - from) * rnd(), p = at(f), q = at(Math.min(1, f + 0.004));
        const nx = -(q.y - p.y), ny = q.x - p.x, nl = Math.hypot(nx, ny) || 1;
        const off = (rnd() < 0.5 ? -1 : 1) * (18 + rnd() * 48);
        const x = p.x + (nx / nl) * off, y = p.y + (ny / nl) * off;
        if (x < 6 || x > W - 6 || y < 6 || y > H - 6) continue;
        switch (b.type) {
          case "forest":
            for (let c = 0; c < 3; c++) layers.deco.append(el("circle", { class: "tree", cx: x + (rnd() - 0.5) * 12, cy: y + (rnd() - 0.5) * 10, r: 2.6 + rnd() * 1.6 }));
            break;
          case "meadow":
            layers.deco.append(el("path", { class: "grass", d: `M${x - 3},${y} l1.5,-4 M${x},${y} l0,-5 M${x + 3},${y} l-1.5,-4` }));
            break;
          case "rock": case "snow":
            layers.deco.append(el("path", { class: "rock", d: `M${x - 5},${y + 3} L${x},${y - 4} L${x + 5},${y + 3}` }));
            break;
          case "village":
            layers.deco.append(el("rect", { class: "house", x: x - 2.5, y: y - 2.5, width: 5, height: 5 }));
            break;
          case "water":
            if (k % 3 === 0) layers.deco.append(el("path", { class: "lake", d: blob(x, y, 6 + rnd() * 5, rnd, 0.5, 8) }));
            break;
        }
      }
    });

    // Contour lines around peaks and passes; a lake shape next to lakes.
    (route.waypoints || []).forEach(w => {
      const p = at(w.at_m / route.length_m);
      if (w.kind === "peak" || w.kind === "pass") {
        for (let r = 16; r <= 46; r += 10) layers.contours.append(el("path", { class: "contour", d: blob(p.x, p.y, r, rnd, 0.35, 12) }));
      } else if (w.kind === "lake") {
        const side = p.x < W / 2 ? 1 : -1;
        layers.contours.append(el("path", { class: "lake", d: blob(p.x + side * 26, p.y - 4, 13, rnd, 0.4, 10) }));
      }
    });

    // The trail: dashed ahead, solid where you've walked.
    const ahead = el("path", { class: "ahead", d });
    const walked = el("path", { class: "walked", d });
    layers.trail.append(ahead, walked);

    const ring = el("circle", { class: "hiker-ring", r: 10 });
    const hiker = el("circle", { class: "hiker", r: 5.5 });
    probe.remove();
    svg.append(layers.terrain, layers.deco, layers.contours, layers.trail, layers.marks, ring, hiker, layers.labels);

    // Waypoint symbols and labels: nudged apart so they never overlap, and
    // moved or wrapped so they never leave the map.
    const placed = { left: [], right: [] };
    const scratch = el("text", { class: "label", visibility: "hidden" });
    layers.labels.append(scratch);
    const measure = str => { scratch.textContent = str; return scratch.getComputedTextLength(); };
    (route.waypoints || []).forEach(w => {
      const p = at(w.at_m / route.length_m);
      const passed = w.at_m <= j.distance_m;
      layers.marks.append(symbol(w.kind, p.x, p.y, "sym" + (passed ? " passed" : "")));
      // Room on each side of the symbol; long names wrap onto several lines.
      const roomRight = W - 4 - (p.x + 12), roomLeft = p.x - 12 - 4;
      let right = p.x < W / 2;
      const words = w.name.split(/\s+/), elev = w.elevation_m ? String(Math.round(w.elevation_m)) : "";
      const full = measure(w.name + (elev ? " " + elev : ""));
      if (full > (right ? roomRight : roomLeft)) right = roomRight >= roomLeft;
      const room = right ? roomRight : roomLeft;
      const lines = [];
      let cur = "";
      for (const word of words) {
        const test = cur ? cur + " " + word : word;
        if (!cur || measure(test) <= room) cur = test; else { lines.push(cur); cur = word; }
      }
      lines.push(cur);
      const elevOnOwnLine = elev && measure(lines[lines.length - 1] + " " + elev) > room;
      const height = (lines.length + (elevOnOwnLine ? 1 : 0) - 1) * 12;

      // Nudge down until this label's block doesn't overlap another on the same side.
      const side = right ? "right" : "left";
      let y = p.y + 4 - height / 2;
      const clash = y0 => placed[side].some(([a, b]) => y0 - 11 < b && y0 + height > a - 11);
      while (clash(y)) y += 12;
      placed[side].push([y, y + height]);

      const x = right ? p.x + 12 : p.x - 12;
      const label = el("text", { class: "label" + (passed ? "" : " upcoming"), x, y, "text-anchor": right ? "start" : "end" });
      lines.forEach((ln, i) => label.append(el("tspan", { x, dy: i ? 12 : 0, text: ln })));
      if (elev) {
        label.append(elevOnOwnLine ? el("tspan", { class: "elev", x, dy: 12, text: elev })
          : el("tspan", { class: "elev", text: " " + elev }));
      }
      layers.labels.append(label);
    });
    scratch.remove();

    // Scale bar and north arrow.
    const pxPerM = L / route.length_m;
    const nice = [100, 200, 500, 1000, 2000, 5000, 10000].find(m => m * pxPerM >= 40) || 10000;
    const sb = nice * pxPerM, sx = 10, sy = H - 12;
    const scaleBar = el("g", { class: "scale" }, [
      el("line", { x1: sx, y1: sy, x2: sx + sb, y2: sy }),
      el("line", { x1: sx, y1: sy - 3, x2: sx, y2: sy + 3 }),
      el("line", { x1: sx + sb, y1: sy - 3, x2: sx + sb, y2: sy + 3 }),
      el("text", { x: sx + sb + 5, y: sy + 3.5, text: fmt(nice) }),
    ]);
    const north = el("g", { class: "north" }, [
      el("path", { d: `M${W - 16},14 l5,12 l-5,-3 l-5,3 Z` }),
      el("text", { x: W - 16, y: 11, "text-anchor": "middle", text: "N" }),
    ]);

    svg.append(scaleBar, north);

    const key = "map:" + scope + ":" + route.id;
    const from = lastDrawn[key] != null ? lastDrawn[key] : j.distance_m;
    const to = j.distance_m;
    lastDrawn[key] = to;
    function place(dist) {
      const f = dist / route.length_m, p = at(f);
      walked.setAttribute("stroke-dasharray", (f * L).toFixed(1) + " " + L.toFixed(1));
      hiker.setAttribute("cx", p.x); hiker.setAttribute("cy", p.y);
      ring.setAttribute("cx", p.x); ring.setAttribute("cy", p.y);
    }
    if (reduceMotion || to <= from) { place(to); return; }
    const t0 = performance.now(), dur = 900; // one deliberate motion: walk the newly earned stretch
    place(from);
    requestAnimationFrame(function step(now) {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      place(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    });
  }

    if (hour < 17) return { stops: ["#2a86c2", "#7fbfe0", "#d3ebf3"], sun: 0.25 };
    if (hour < 19) return { stops: ["#35689e", "#d9b27f", "#f6cd86"], sun: 0.75 };

  }

  function HikeScene(host, j, avatarUrl, fromDistance) {

    const horizon = sky.stops[2];

    // World: long enough to feel like a journey, capped for huge routes.
    const worldW = Math.min(60000, Math.max(W * 3, route.length_m / 1000 * 170));
    const pxPerM = worldW / route.length_m;
    const wps = (route.waypoints || []).slice().sort((a, b) => a.at_m - b.at_m);
    const withElev = wps.filter(w => w.elevation_m);

    function hut(x, y, s) {

        const bob = walkStart ? Math.abs(Math.sin(now / 90)) * 2 : 0;
        const x = hx - camX, y = groundY(hx) + 3 - bob;

    // ---- looking around: wheel, keys, drag ----
    host.addEventListener("wheel", e => {
      e.preventDefault(); walkStart = 0;
      target = clampCam(target + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 1.3); kick();
    }, { passive: false });
    host.addEventListener("keydown", e => {
      const step = e.shiftKey ? W * 0.9 : 120;
      const moves = { ArrowRight: target + step, ArrowLeft: target - step, Home: -W * 0.3, End: worldW - W * 0.6 };

    else hikerM = j.distance_m;
    resize();
  }

  function hikeView(j, s) {
    const key = scope + ":" + j.route.id;
    const from = lastDrawn[key] != null ? Math.min(lastDrawn[key], j.distance_m) : j.distance_m;
    lastDrawn[key] = j.distance_m;

    const scene = el("div", { class: "scene", tabindex: "0", role: "img",
      "aria-label": j.route.name + ": " + fmt(j.distance_m) + " / " + fmt(j.route.length_m) + ". " + t("scrollHint") });
    const km = j.distance_m >= 1000;
    const value = km ? j.distance_m / 1000 : Math.round(j.distance_m);
    const digits = km && value < 100 ? 1 : 0;
    const shown = digits ? value.toFixed(1).replace(".", t("decimal")) : String(Math.round(value));
    const w = j.last_waypoint, st = j.story;
    const flavor = st && (!w || st.at_m >= w.at_m) ? st.text : (w && w.text) || "";
    const info = el("div", { class: "hike-info" }, [
      el("div", { class: "day", text: t("dayN", { n: j.day || 1 }) }),
      el("div", { class: "big", text: shown }),
      el("div", { class: "unit", text: plural(km ? "kmWord" : "mWord", value, digits).replace(/^[\d.,\s]+/, "") }),
      el("div", { class: "place", text: w ? w.name : t("startPlace") }),
      flavor ? el("div", { class: "flavor", text: flavor }) : null,
      j.finished ? el("div", { class: "next", text: t("completed") })
        : j.next_waypoint ? el("div", { class: "next", text: t("nextStop") + ": " + t("nextIn", { name: j.next_waypoint.name, d: fmt(j.to_next_m || 0) }) }) : null,
    ]);
    const card = el("div", { class: "hike" }, [scene, info]);
    root.append(card, el("p", { class: "hint", text: t("scrollHint") }));
    HikeScene(scene, j, data.avatar, from);
    return card;
  }

  // ---------------------------------------------------------------- places
  function placesView(j) {
    const list = el("ol", { class: "places" });
    let hereShown = false;
    const here = () => el("li", { class: "here" }, [el("span", { class: "dot" }),
      el("div", { class: "row" }, [el("span", { class: "nm", text: t("here") }), el("span", { class: "meta", text: fmt(j.distance_m) })])]);
    (j.route.waypoints || []).forEach(w => {
      const passed = w.at_m <= j.distance_m;
      if (!passed && !hereShown) { list.append(here()); hereShown = true; }
      const name = w.name + (w.elevation_m ? ", " + Math.round(w.elevation_m) + " " + t("m") : "");
      list.append(el("li", { class: passed ? "passed" : "" }, [
        el("span", { class: "dot" }),
        el("div", { class: "row" }, [
          el("span", { class: "nm", text: name }),
          el("span", { class: "meta", text: passed ? t("passedAt", { d: fmt(w.at_m) }) : t("left", { d: fmt(w.at_m - j.distance_m) }) }),
        ]),
        passed && w.text ? el("div", { class: "txt", text: w.text }) : null,
      ]));
    });
    if (!hereShown && !j.finished) list.append(here());
    return list;
  }

  // ---------------------------------------------------------------- stats
  function chartView(daily) {
    const W = 300, H = 120, top = 16, bottom = 18, n = daily.length;
    const max = Math.max(...daily.map(d => d.m), 0);
    const svg = el("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" });
    const bw = W / n;
    daily.forEach((d, i) => {
      const h = max > 0 ? (d.m / max) * (H - top - bottom) : 0;
      const date = new Date(d.date + "T00:00:00Z");
      const label = date.toLocaleDateString(lang, { day: "numeric", month: "short", timeZone: "UTC" });
      svg.append(el("rect", { class: "bar" + (i === n - 1 ? " today" : ""), x: i * bw + 2, y: H - bottom - h, width: bw - 4, height: Math.max(h, d.m > 0 ? 2 : 0), rx: 1.5 },
        [el("title", { text: label + ": " + fmt(d.m) })]));
      if (i % 2 === (n - 1) % 2) {
        svg.append(el("text", { x: i * bw + bw / 2, y: H - 4, "text-anchor": "middle", text: String(date.getUTCDate()) }));
      }
    });
    svg.append(el("line", { class: "base", x1: 0, y1: H - bottom + 0.5, x2: W, y2: H - bottom + 0.5 }));
    if (max > 0) svg.append(el("text", { x: 0, y: 10, text: fmt(max) }));
    return svg;
  }

  function statsView(j, s) {
    const stat = (v, k) => el("div", { class: "stat" }, [el("div", { class: "v", text: v }), el("div", { class: "k", text: k })]);
    const box = el("div");
    box.append(el("div", { class: "stats" }, [
      stat(fmt(s.today_m || 0), t("today")),
      stat(plural("days", j.streak_days || 0), t("streak")),
      stat(fmt(j.distance_m), t("onTrail")),
      stat(String(j.commits || 0), t("commits")),
    ]));
    const daily = j.daily || [];
    box.append(el("p", { class: "chart-title", text: t("lastDays") }));
    if (daily.some(d => d.m > 0)) box.append(chartView(daily));
    else box.append(el("p", { class: "hint", text: t("noActivity") }));
    const ach = achievementsView(j.achievements);
    if (ach) box.append(ach);
    return box;
  }

  function achievementsView(list) {
    if (!list || !list.length) return null;
    const got = list.filter(a => a.unlocked_at);
    return el("section", { class: "achievements" }, [
      el("h2", {}, [document.createTextNode(t("achievements") + " "), el("span", { text: t("achCount", { n: got.length, m: list.length }) })]),
      el("ul", {}, list.map(a => el("li", { class: a.unlocked_at ? "got" : "" }, [
        el("span", { class: "mark", "aria-hidden": "true" }),
        el("span", { class: "name", text: a.name || t("secret") }),
        a.description ? el("span", { class: "desc", text: a.description }) : null,
      ]))),
    ]);
  }

  // ---------------------------------------------------------------- views
  function emptyView(title, text, buttonLabel, msg) {
    root.replaceChildren(el("div", { class: "empty" }, [
      el("h1", { text: title }), el("p", { text }),
      buttonLabel ? el("button", { class: "primary", text: buttonLabel, onclick: () => send(msg) }) : null,
    ]));
  }

  function header(j, s) {
    const other = scope === "global" ? "project" : "global";
    return el("div", { class: "head" }, [
      el("h1", { text: j ? j.route.name : "" }),
      data.repo ? el("button", { class: "scope", title: t(other === "project" ? "scopeProject" : "scopeAll"),
        text: t(scope === "global" ? "scopeAll" : "scopeProject") + " ⇄", onclick: () => { scope = other; render(); } }) : null,
    ]);
  }

  function render() {
    if (!data) return;
    lang = pickLang(data.locale || (data.status && data.status.locale));
    document.documentElement.lang = lang;
    if (data.state === "not_initialized") return emptyView(t("setupTitle"), t("setupText"), t("setupBtn"), { command: "setup" });
    if (data.state === "error") return emptyView(t("errorTitle"), data.error || t("unknownError"), t("retry"), { command: "refresh" });

    const s = data.status || {};
    if (!data.repo) scope = "global";
    if (scope === "project" && !s.tracked) {
      emptyView(t("notCountedTitle"), t("notCountedText"), t("countBtn"), { command: "enableProject" });
      return root.prepend(header(null, s));
    }
    if (scope === "project" && !s.project) {
      emptyView(t("noProjectTitle"), t("noProjectText"), t("chooseTrail"), { command: "chooseRoute", scope: "project" });
      return root.prepend(header(null, s));
    }
    const j = scope === "project" ? s.project : s.global;
    if (!j || !j.route) return emptyView(t("noTrailTitle"), t("noTrailText"), t("chooseTrail"), { command: "chooseRoute", scope });

    root.replaceChildren(header(j, s), el("p", { class: "distance" }, [
      el("strong", { text: fmt(j.distance_m) }),
      document.createTextNode(" / " + fmt(j.route.length_m) + " (" + String(j.percent).replace(".", t("decimal")) + "%)"),
    ]));

    const tabs = el("div", { class: "views", role: "tablist" }, ["journey", "map", "places", "stats"].map(v =>
      el("button", { role: "tab", "aria-selected": String(view === v), text: t("view" + v[0].toUpperCase() + v.slice(1)),
        onclick: () => { view = v; render(); } })));
    root.append(tabs);

    if (view === "journey") {
      hikeView(j, s);
    } else if (view === "map") {
      drawMap(j);
      const facts = el("dl", { class: "facts" });
      if (j.finished) facts.append(el("dt", { text: "✓" }), el("dd", { class: "finished", text: t("completed") }));
      else if (j.next_waypoint) facts.append(el("dt", { text: t("nextStop") }),
        el("dd", { text: t("nextIn", { name: j.next_waypoint.name, d: fmt(j.to_next_m || 0) }) }));
      root.append(facts);
      const w = j.last_waypoint, st = j.story;
      const card = st && (!w || st.at_m >= w.at_m) ? { text: st.text } : w && w.text ? { text: w.text, from: w.name } : null;
      if (card) root.append(el("div", { class: "postcard" }, [el("p", { text: card.text }), card.from ? el("p", { class: "from", text: card.from }) : null]));
    } else if (view === "places") {
      root.append(placesView(j));
    } else {
      root.append(statsView(j, s));
    }
    root.append(el("div", { class: "actions" }, [
      el("button", { class: "link", text: j.finished ? t("startNew") : t("changeTrail"), onclick: () => send({ command: "chooseRoute", scope }) }),
      view === "journey" ? el("button", { class: "link", text: t("changeIcon"), onclick: () => send({ command: "setAvatar" }) }) : null,
      view === "journey" && data.avatar_custom ? el("button", { class: "link", text: t("resetIcon"), onclick: () => send({ command: "resetAvatar" }) }) : null,
    ]));
  }

  function update(next) { data = next; render(); }
  window.commitHike = { update: d => update(typeof d === "string" ? JSON.parse(d) : d) };
  window.addEventListener("message", e => { if (e.data && e.data.type === "update") update(e.data); });
  send({ command: "ready" });
})();
</script>
</body>
</html>
