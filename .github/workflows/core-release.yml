# Publishes the core binaries to GitHub Releases when a version tag is pushed.
# The marketplaces are published separately (task release:publish).
name: Core binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # a dry run from the Actions tab: builds, publishes nothing

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false # the core has no dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but VERSION is $(cat VERSION)"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: >-
            release --clean --release-notes ${{ runner.temp }}/notes.md
            ${{ startsWith(github.ref, 'refs/tags/') && ' ' || '--snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the Linux binary
        run: |
          sh scripts/install.sh --from dist --to "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/commit-hike" version
