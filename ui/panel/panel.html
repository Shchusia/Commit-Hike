<!DOCTYPE html>
<html lang="en">

<title>Commit Hike</title>
<style nonce="{{NONCE}}">
/*
 * Shared by the VS Code webview and the JetBrains JCEF tool window.
 * Data comes from the host (see docs/protocol.md, "Panel"):
 *   {type, state, error, repo, locale, status, avatar, avatar_custom,
 *    assets: {routeId: {images, html}}, team, team_error, locale_setting}
 * Colors come from the host theme: VS Code provides --vscode-* variables,
 * the JetBrains host injects --jb-* variables on :root.
 */
/*
 * The host variables are declared here as "not set" (initial = the
 * guaranteed-invalid value), so editors can resolve them; var() still falls
 * back exactly as if they were undeclared. :where() has zero specificity, so
 * the host's own values (inline styles on <html>) always win.
 */
:where(html) {
  --jb-bg: initial;
  --jb-border: initial;
  --jb-btn-bg: initial;
  --jb-btn-fg: initial;
  --jb-btn-hover: initial;
  --jb-fg: initial;
  --jb-focus: initial;
  --jb-font: initial;
  --jb-font-size: initial;
  --jb-link: initial;
  --jb-muted: initial;
  --vscode-button-background: initial;
  --vscode-button-foreground: initial;
  --vscode-button-hoverBackground: initial;
  --vscode-descriptionForeground: initial;
  --vscode-focusBorder: initial;
  --vscode-font-family: initial;
  --vscode-font-size: initial;
  --vscode-foreground: initial;
  --vscode-menu-background: initial;
  --vscode-menu-foreground: initial;
  --vscode-menu-selectionBackground: initial;
  --vscode-panel-border: initial;
  --vscode-sideBar-background: initial;
  --vscode-textLink-foreground: initial;
  --vscode-widget-border: initial;
}
:root {
  --ct-bg: var(--vscode-sideBar-background, var(--jb-bg, #1e1f22));
  --ct-fg: var(--vscode-foreground, var(--jb-fg, #cfd1d6));
  --ct-muted: var(--vscode-descriptionForeground, var(--jb-muted, #8c8f96));
  --ct-line: var(--vscode-widget-border, var(--vscode-panel-border, var(--jb-border, #3a3c42)));
  --ct-link: var(--vscode-textLink-foreground, var(--jb-link, #6ea6ff));
  --ct-btn-bg: var(--vscode-button-background, var(--jb-btn-bg, #3574f0));
  --ct-btn-fg: var(--vscode-button-foreground, var(--jb-btn-fg, #ffffff));
  --ct-btn-hover: var(--vscode-button-hoverBackground, var(--jb-btn-hover, #4682fa));
  --ct-focus: var(--vscode-focusBorder, var(--jb-focus, #3574f0));
  --ct-font: var(--vscode-font-family, var(--jb-font, system-ui, sans-serif));
  --ct-size: var(--vscode-font-size, var(--jb-font-size, 13px));
  --ct-card: color-mix(in srgb, var(--ct-fg) 5%, var(--ct-bg));
  --ct-card-2: color-mix(in srgb, var(--ct-fg) 9%, var(--ct-bg));
  /* trail-blaze paint: the one accent of the panel */
  --ct-blaze: #e8b53d;
  --ct-blaze-ink: #3b2a05;
  --ct-good: #6fbf73;
  --ct-serif: Georgia, "DejaVu Serif", "Times New Roman", serif;
}
body.vscode-light, body[data-theme="light"] { --ct-blaze: #c98a00; --ct-blaze-ink: #fff8e6; --ct-good: #3d8b41; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ct-bg); color: var(--ct-fg);
  font-family: var(--ct-font), sans-serif; font-size: var(--ct-size); line-height: 1.45;
  padding: 12px 14px 22px; max-width: 560px;
}
button { font: inherit; color: inherit; }
button:focus-visible, [role="tab"]:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--ct-focus); outline-offset: 2px; }
[hidden] { display: none !important; }
/* less motion: every CSS animation and transition, route scenes included */
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
  animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
/* more contrast: solid text, visible borders, thicker focus */
html.hc { --ct-muted: var(--ct-fg); --ct-line: var(--ct-fg); --ct-card: var(--ct-bg); --ct-card-2: color-mix(in srgb, var(--ct-fg) 16%, var(--ct-bg)); }
/* outlines as inset shadows: as visible as a border, but they don't change any size */
html.hc .stat, html.hc .chip-btn, html.hc [role="tab"], html.hc .chart-tip, html.hc .card, html.hc .mapbox, html.hc .scene, html.hc .menu {
  box-shadow: inset 0 0 0 1px var(--ct-fg) !important; }
html.hc [role="tab"][aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--ct-fg) !important; }
html.hc button:focus-visible, html.hc [role="tab"]:focus-visible, html.hc [tabindex]:focus-visible { outline: 2px solid var(--ct-focus); outline-offset: 2px; }
html.hc .chart .bar-d { fill: var(--ct-fg); }
html.hc .chart .bar-d.today, html.hc .cal-d.l4 { fill: var(--ct-blaze); }
html.hc .cal-d { stroke: var(--ct-fg); stroke-width: .35; }
html.hc .hint, html.hc .flavor { opacity: 1; }

/* ---------------------------------------------------------------- header */
.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; min-width: 0; font-size: 1.3em; font-weight: 650; margin: 0; letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-btn { background: var(--ct-card-2); border: 1px solid transparent; border-radius: 999px; padding: 2px 10px;
  color: var(--ct-fg); cursor: pointer; white-space: nowrap; font-size: .92em; }
.chip-btn:hover { border-color: var(--ct-line); }
.icon-btn { background: none; border: 0; border-radius: 4px; width: 28px; height: 26px; cursor: pointer; color: var(--ct-muted);
  display: inline-grid; place-items: center; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--ct-card-2); color: var(--ct-fg); }

.progress { margin: 10px 0 2px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.progress .row strong { font-size: 1.05em; }
.progress .row span { color: var(--ct-muted); }
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--ct-card-2); margin-top: 5px; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ct-blaze) 70%, #fff 0%), var(--ct-blaze)); }
.bar > b { position: absolute; top: 1px; bottom: 1px; width: 2px; background: var(--ct-bg); opacity: .55; }
.bar.thin { height: 5px; }

/* ---------------------------------------------------------------- menu */
.menu { position: absolute; right: 12px; top: 40px; z-index: 20; min-width: 230px; max-width: calc(100vw - 24px);
  background: var(--vscode-menu-background, var(--ct-bg)); color: var(--vscode-menu-foreground, var(--ct-fg));
  border: 1px solid var(--ct-line); border-radius: 6px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu .sep { height: 1px; background: var(--ct-line); margin: 4px 2px; }
.menu .label { color: var(--ct-muted); font-size: .85em; padding: 4px 10px 2px; text-transform: uppercase; letter-spacing: .05em; }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; background: none; border: 0; text-align: left;
  padding: 5px 10px; border-radius: 4px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--vscode-menu-selectionBackground, var(--ct-card-2)); outline: none; }
.menu button .ck { width: 14px; text-align: center; color: var(--ct-blaze); }

/* ---------------------------------------------------------------- tabs */
.tabs { display: flex; gap: 2px; margin: 12px 0 10px; padding: 2px; border-radius: 6px; background: var(--ct-card); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; background: none; border: 0; border-radius: 4px; padding: 4px 6px; white-space: nowrap; color: var(--ct-muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ct-bg); color: var(--ct-fg); box-shadow: 0 0 0 1px var(--ct-line); }
.tabs .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ct-blaze); margin-left: 4px; vertical-align: 2px; }

/* ---------------------------------------------------------------- hike */
.hike { border-radius: 8px; overflow: hidden; background: #0b0e12; color: #ece8de; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.scene { --mm-h: 0px; position: relative; height: 270px; cursor: grab; outline: none; touch-action: pan-y; overflow: hidden; user-select: none; }
.scene:focus-visible { box-shadow: inset 0 0 0 2px var(--ct-focus); }
.scene.dragging { cursor: grabbing; }
.scene canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.scene .objs { position: absolute; inset: 0; pointer-events: none; }
.scene .obj { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; will-change: transform, opacity; }
.scene .obj img { display: block; height: 100%; width: auto; }
.scene .obj.far { filter: saturate(.65) brightness(1.08); }
.scene .obj .cap { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap;
  font-size: 11px; padding: 1px 7px; border-radius: 9px; background: rgba(12,16,20,.66); color: #ece8de; transition: opacity .4s; }
.hud { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.hud span { background: rgba(10,13,17,.62); border-radius: 12px; padding: 2px 9px; font-size: 12px; font-variant-numeric: tabular-nums;
  backdrop-filter: blur(3px); }
.hud .up { color: #ffcf7a; } .hud .down { color: #9fd3ff; }
.minimap { position: absolute; right: 8px; top: 8px; border-radius: 6px; cursor: pointer; overflow: hidden;
  background: rgba(10,13,17,.58); box-shadow: 0 1px 6px rgba(0,0,0,.45); backdrop-filter: blur(3px); }
.minimap:hover, .minimap:focus-visible { box-shadow: 0 0 0 1.5px var(--ct-blaze), 0 1px 6px rgba(0,0,0,.45); outline: none; }
.minimap path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.minimap .mm-ahead { stroke: rgba(236,232,222,.55); stroke-width: 1.4; stroke-dasharray: 2.5 2.5; }
.minimap.img .mm-ahead { stroke: rgba(90,50,20,.75); }
.minimap .mm-walked { stroke: var(--ct-blaze); stroke-width: 2.6; }
.minimap.img .mm-walked { stroke: #b0441e; }
.minimap .mm-wp { fill: rgba(236,232,222,.75); }
.minimap.img .mm-wp { fill: rgba(90,50,20,.7); }
.minimap .mm-wp.passed { fill: var(--ct-blaze); }
.minimap .mm-mate { stroke: #0e1318; stroke-width: 1; vector-effect: non-scaling-stroke; }
.minimap .mm-me { fill: #fff; stroke: #b0441e; stroke-width: 2; vector-effect: non-scaling-stroke; }
.recenter { position: absolute; right: 8px; top: calc(14px + var(--mm-h, 0px)); border: 0; border-radius: 12px; padding: 3px 10px;
  background: rgba(10,13,17,.66); color: #ece8de; font-size: 12px; cursor: pointer; }
.toast { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(10,13,17,.78); border-radius: 8px;
  padding: 8px 11px; font-size: 12.5px; line-height: 1.4; border-left: 3px solid var(--ct-blaze); backdrop-filter: blur(4px);
  transition: opacity .5s, transform .5s; }
.toast b { color: #ffd98a; font-weight: 600; margin-right: 4px; }
.toast.off { opacity: 0; transform: translateY(8px); pointer-events: none; }
.toast.danger { border-left-color: #d9534f; }
.toast.danger b { color: #ff9b8f; }
.hud .dev { background: rgba(160, 60, 200, .7); }
.card.danger { border-left: 3px solid #d9534f; }
.places li.danger .dot { border-color: #d9534f; }
.places li.danger.passed .dot { background: #d9534f; border-color: #d9534f; }
.places li.ug .dot { border-color: #8a8378; background: #3a3530; }
.places li.ug .nm { font-style: italic; }

.profile { display: block; width: 100%; height: 62px; cursor: pointer; background: #0e1318; }
.profile .area-done { fill: url(#pf-done); }
.profile .area-left { fill: rgba(236,232,222,.10); }
.profile .line { fill: none; stroke: rgba(236,232,222,.55); stroke-width: 1.2; }
.profile .line-done { fill: none; stroke: var(--ct-blaze); stroke-width: 1.6; }
.profile .tick { stroke: rgba(236,232,222,.35); stroke-width: 1; }
.profile .lbl { fill: rgba(236,232,222,.7); font-size: 9.5px; }
.profile .me { fill: var(--ct-blaze); stroke: #0e1318; stroke-width: 2; }
.profile .mate { stroke: #0e1318; stroke-width: 1.5; }
.profile .view { fill: rgba(255,255,255,.07); stroke: rgba(255,255,255,.18); }
.profile .factpin { fill: #9fd3ff; }
.profile .ug { fill: rgba(0,0,0,.5); }
.profile .ug-edge { stroke: rgba(236,232,222,.35); stroke-width: 1; stroke-dasharray: 2 2; }
.profile .dangerpin { fill: #e0574f; }

.hike-info { padding: 12px 16px 16px; text-align: center; background: linear-gradient(#0e1318, #0b0e12); }
.hike-info .day { font-family: var(--ct-serif), serif; font-size: 1.05em; letter-spacing: .03em; color: #cfc9bb; }
.hike-info .big { font-family: var(--ct-serif), serif; font-size: 3em; line-height: 1.05; color: var(--ct-blaze); font-variant-numeric: oldstyle-nums; margin-top: 2px; }
.hike-info .unit { color: var(--ct-blaze); letter-spacing: .08em; font-variant: small-caps; font-family: var(--ct-serif), serif; }
.hike-info .place { margin-top: 12px; color: #a9b1b8; font-variant: small-caps; letter-spacing: .05em; font-family: var(--ct-serif), serif; }
.hike-info .flavor { font-style: italic; margin-top: 2px; font-size: 1.04em; font-family: var(--ct-serif), serif; color: #ece8de; }
.next { margin: 14px auto 0; max-width: 360px; text-align: left; font-size: .92em; color: #aab2b9; }
.next .row { display: flex; justify-content: space-between; gap: 8px; }
.next .row b { color: #ece8de; font-weight: 600; }
.next .bar { background: rgba(255,255,255,.1); }
.next .climb { color: #ffcf7a; }
.pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
.pills span { background: rgba(255,255,255,.07); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: #cfd4d8; font-variant-numeric: tabular-nums; }
.pills span b { color: #ece8de; font-weight: 600; }
.build-info { margin: 18px 0 0; color: var(--ct-muted); font-size: .85em; text-align: center; opacity: .8; }
.hint { color: var(--ct-muted); font-size: .88em; margin: 6px 2px 0; }

.card { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--ct-card); border: 1px solid color-mix(in srgb, var(--ct-line) 60%, transparent); }
.card h3 { margin: 0 0 4px; font-size: .85em; font-weight: 600; color: var(--ct-muted); text-transform: uppercase; letter-spacing: .06em; }
.card p { margin: 0; }
.card .from { color: var(--ct-muted); font-size: .9em; margin-top: 4px; }
.card.fact { border-left: 3px solid #6fb6e8; }
.card.story { border-left: 3px solid var(--ct-blaze); font-family: var(--ct-serif), serif; font-style: italic; }
.card.locked { color: var(--ct-muted); }

/* ---------------------------------------------------------------- map */
.mapbox { position: relative; border-radius: 8px; overflow: hidden; background: #d9dfcf; aspect-ratio: 320 / 440; touch-action: none;
  box-shadow: 0 0 0 1px rgba(0,0,0,.2); cursor: grab; }
.mapbox.dragging { cursor: grabbing; }
.mapworld { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
.mapworld canvas, .mapworld svg, .mapbox > .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mapctl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.mapctl button { width: 28px; height: 28px; border: 0; border-radius: 6px; background: rgba(255,255,255,.85); color: #2b3136;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; font-size: 15px; line-height: 1; }
.mapctl button:hover { background: #fff; }
.map-svg .casing, .map-svg .ahead, .map-svg .walked, .map-svg .walked-edge, .map-svg .tunnel, .map-svg .tunnel-bg { vector-effect: non-scaling-stroke; }
.mapscale { position: absolute; left: 10px; bottom: 8px; display: flex; align-items: flex-end; gap: 6px; font-size: 11px; line-height: 1;
  color: #22281f; pointer-events: none; text-shadow: 0 0 3px rgba(250,248,240,.95), 0 0 2px rgba(250,248,240,.95); }
.mapscale i { display: block; height: 5px; border: 1.5px solid #22281f; border-top: 0; box-shadow: 0 1px 0 rgba(250,248,240,.8); }
.mapcompass { position: absolute; left: 10px; top: 8px; pointer-events: none; }
.mapcompass path { fill: #22281f; } .mapcompass text { font-size: 7px; fill: #22281f; }
.map-svg .casing { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.map-svg .ahead { fill: none; stroke: #7a2e1c; stroke-width: 2.2; stroke-dasharray: 5 4; stroke-linecap: round; opacity: .85; }
.map-svg .walked { fill: none; stroke: var(--ct-blaze); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.map-svg .walked-edge { fill: none; stroke: #5a3a06; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.map-svg .sym { stroke: #2a2f2b; stroke-width: 1.3; fill: #fbf8ef; stroke-linejoin: round; }
.map-svg .sym.passed { fill: var(--ct-blaze); stroke: #3b2a05; }
.map-svg .label { fill: #22281f; font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: rgba(250,248,240,.9); stroke-width: 3px; stroke-linejoin: round; }
.map-svg .label .elev { font-size: 9px; font-weight: 400; }
.map-svg .label.upcoming { opacity: .8; font-weight: 500; }
.map-svg .hiker { fill: #fff; stroke: #2a2f2b; stroke-width: 2; }
.map-svg .pulse { fill: none; stroke: var(--ct-blaze); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .map-svg .pulse { animation: none; } }
.map-svg .mate { stroke: #fff; stroke-width: 1.5; }
.map-svg .mate-txt { font-size: 7.5px; fill: #fff; font-weight: 700; text-anchor: middle; pointer-events: none; }
.map-svg .pin { cursor: pointer; }
.map-svg .pin circle { fill: #2f7fbf; stroke: #fff; stroke-width: 1.5; }
.map-svg .pin text { fill: #fff; font-size: 9px; font-weight: 700; text-anchor: middle; font-family: var(--ct-serif), serif; }
.map-svg .scale line { stroke: #22281f; stroke-width: 1.5; }
.map-svg .thumb { pointer-events: none; }
.map-svg .tunnel-bg { fill: none; stroke: #2b2622; stroke-width: 7; stroke-linecap: round; opacity: .85; }
.map-svg .tunnel { fill: none; stroke: #d8cfbf; stroke-width: 2; stroke-dasharray: 2 4; stroke-linecap: round; }
.map-svg .portal { fill: #2b2622; stroke: #d8cfbf; stroke-width: 1; }
.map-svg .danger-pin { cursor: pointer; }
.map-svg .danger-pin path { fill: #c9302c; stroke: #fff; stroke-width: 1.2; stroke-linejoin: round; }
.map-svg .danger-pin text { fill: #fff; font-size: 8.5px; font-weight: 800; text-anchor: middle; }
.minimap .mm-tunnel { stroke: #1b1714; stroke-width: 3.2; stroke-dasharray: 1.5 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 8px 2px 0; color: var(--ct-muted); font-size: .86em; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

/* ---------------------------------------------------------------- places */
.places { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.places::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; border-left: 2px dashed var(--ct-line); }
.places li { position: relative; padding: 0 0 12px 26px; }
.places .dot { position: absolute; left: 1px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ct-bg);
  border: 2px solid var(--ct-muted); display: grid; place-items: center; font-size: 8px; }
.places li.passed .dot { background: var(--ct-blaze); border-color: var(--ct-blaze); color: var(--ct-blaze-ink); }
.places li.here .dot { border: 3px solid var(--ct-blaze); background: var(--ct-fg); }
.places li.fact .dot, .places li.obj .dot { width: 10px; height: 10px; left: 3px; top: 5px; border-width: 1.5px; }
.places li.fact.passed .dot { background: #6fb6e8; border-color: #6fb6e8; }
.places .row { display: flex; justify-content: space-between; gap: 8px; }
.places .nm { font-weight: 600; }
.places li:not(.passed):not(.here) .nm { font-weight: 400; }
.places .meta { color: var(--ct-muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .92em; }
.places .txt { color: var(--ct-muted); font-size: .92em; margin-top: 1px; }
.places li.fact .txt { color: var(--ct-fg); opacity: .9; }
.places li.here { color: var(--ct-blaze); }
.places li.seg { color: var(--ct-muted); font-size: .82em; margin: -6px 0 0; padding: 0 0 8px 26px; font-variant-numeric: tabular-nums; }
.places li.seg .u { color: color-mix(in srgb, var(--ct-blaze) 80%, var(--ct-fg)); }
.places img.th { height: 30px; vertical-align: middle; margin-right: 6px; }

/* ---------------------------------------------------------------- team */
.team { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 8px; }
.team li { display: grid; grid-template-columns: 22px 30px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px;
  border-radius: 8px; background: var(--ct-card); }
.team li.me { box-shadow: inset 0 0 0 1px var(--ct-blaze); }
.team .rank { color: var(--ct-muted); font-variant-numeric: tabular-nums; text-align: right; }
.team .ava { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; }
.team .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .nm small { color: var(--ct-blaze); font-weight: 500; margin-left: 4px; }
.team .dist { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.team .sub { grid-column: 3 / 5; color: var(--ct-muted); font-size: .86em; display: flex; gap: 10px; flex-wrap: wrap; }
.team .bar { grid-column: 3 / 5; margin-top: 0; }

/* ---------------------------------------------------------------- stats */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 4px 0; }
.stat { background: var(--ct-card); border-radius: 8px; padding: 8px 10px; }
.stat .v { font-size: 1.3em; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .k { color: var(--ct-muted); font-size: .88em; }
.chart { display: block; width: 100%; height: auto; margin-top: 8px; }
.chart .bar-d { fill: color-mix(in srgb, var(--ct-fg) 28%, transparent); }
.chart .bar-d.today { fill: var(--ct-blaze); }
.chart .bar-d.active { fill: color-mix(in srgb, var(--ct-fg) 55%, transparent); }
.chart .bar-d.today.active { fill: color-mix(in srgb, var(--ct-blaze) 80%, white); }
.chart .bar-hit { fill: transparent; cursor: default; outline: none; }
.chart .bar-hit:focus-visible { stroke: var(--ct-blaze); stroke-width: 1.5; }
.chart-box { position: relative; }
.chart-tip { position: absolute; z-index: 2; pointer-events: none; white-space: nowrap; padding: 4px 8px; border-radius: 6px; font-size: 12px; line-height: 1.35;
  background: var(--ct-card, #2b2d30); color: var(--ct-fg); border: 1px solid var(--ct-line); box-shadow: 0 4px 14px rgba(0,0,0,.25); display: flex; gap: 8px; align-items: baseline; }
.chart-tip .d { color: var(--ct-muted); }
.settings .set-head { display: flex; align-items: center; gap: 12px; margin: 10px 0 6px; }
.settings .set-head h2 { margin: 0; font-size: 1.1em; }
.set-row { margin: 14px 0; padding-bottom: 12px; border-bottom: 1px solid var(--ct-line); }
.set-row:last-child { border-bottom: 0; }
.set-row h3 { margin: 0 0 4px; font-size: 1em; }
.set-h { margin: 0 0 8px; color: var(--ct-muted); font-size: .9em; }
.choice { display: flex; flex-wrap: wrap; gap: 4px; }
.choice button { background: var(--ct-card-2); border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ct-fg); }
.choice button.on { border-color: var(--ct-blaze); background: color-mix(in srgb, var(--ct-blaze) 18%, var(--ct-bg)); }
.choice button[disabled] { opacity: .45; cursor: not-allowed; }
.choice.days button { min-width: 42px; }
.set-btns { display: flex; flex-wrap: wrap; gap: 6px; }
html.hc .choice button { box-shadow: inset 0 0 0 1px var(--ct-fg); }
html.hc .choice button.on { box-shadow: inset 0 0 0 2px var(--ct-blaze); }
.places-mode { margin: 10px 0 12px; }
.series-next { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 12px 0; padding: 10px 12px; border-radius: 8px;
  background: color-mix(in srgb, var(--ct-blaze) 12%, var(--ct-bg)); border: 1px solid color-mix(in srgb, var(--ct-blaze) 45%, transparent); }
.series-next .k { color: var(--ct-muted); font-size: .85em; }
.chip-btn.primary { border-color: var(--ct-blaze); }
.pass-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 0 8px; }
.pass-head .nm { font-weight: 600; }
.pass-head .meta { color: var(--ct-muted); font-size: .85em; white-space: nowrap; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.stamp { --h: 40; --r: 0deg; --ink: hsl(var(--h) 55% 58%); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 10px; text-align: center; color: var(--ink); transform: rotate(var(--r));
  border: 2px solid var(--ink); box-shadow: inset 0 0 0 3px var(--ct-bg), inset 0 0 0 4px color-mix(in srgb, var(--ink) 70%, transparent);
  background: color-mix(in srgb, var(--ink) 8%, var(--ct-bg)); }
.stamp .ic { font-size: 1.2em; line-height: 1; }
.stamp .nm { font-size: .78em; font-weight: 700; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stamp .dt { font-size: .68em; opacity: .85; }
html.reduce-motion .stamp { transform: none; }
.year-actions, .badge-row { display: flex; justify-content: flex-end; margin-top: 8px; }
.badge-row { justify-content: flex-start; margin-top: 16px; }
.hike-actions { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.hike-actions .hint { margin: 8px 0 0; }
.hike-actions .share { flex: none; margin-top: 6px; }
.share-wrap { position: relative; flex: none; }
.share-wrap .menu { top: calc(100% + 4px); right: 0; }
.share-wrap .menu .net { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4px; }
.share-wrap .menu .masto { display: flex; gap: 4px; padding: 4px 10px 6px; }
.share-wrap .menu .masto button { width: auto; flex: none; }
.share-wrap .menu .masto input { flex: 1; min-width: 9em; font: inherit; color: inherit; background: var(--ct-card-2); border: 1px solid var(--ct-line); border-radius: 4px; padding: 2px 6px; }
.team-week .big { font-size: 1.5em; font-weight: 650; font-variant-numeric: tabular-nums; }
.team-week .trend { font-size: .9em; margin-left: 6px; }
.team-week .trend.up { color: var(--ct-good); }
.team-week .trend.down { color: var(--ct-muted); }
.week-rows { display: grid; grid-template-columns: minmax(0, 7em) 1fr auto; gap: 4px 8px; align-items: center; margin-top: 8px; font-size: .92em; }
.week-rows .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.week-rows .nm.me { color: var(--ct-blaze); font-weight: 600; }
.week-rows .bar { margin: 0; }
.week-rows .d { font-variant-numeric: tabular-nums; color: var(--ct-muted); }
.goal-bar { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: var(--ct-card-2); margin: 8px 0 4px; }
.goal-bar i { display: block; height: 100%; }
.goal-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .86em; color: var(--ct-muted); margin-top: 4px; }
.goal-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--sw); }
.goal-pick { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.goal-pick select { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--ct-card-2); border: 1px solid var(--ct-line); border-radius: 4px; padding: 3px 6px; }
.share-note { margin: 6px 0 0; color: var(--ct-blaze); font-size: .9em; text-align: right; }
.year { margin-top: 14px; }
.year-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.year-head .section-title { margin: 0; }
.year-head .chip-btn[disabled] { opacity: .35; cursor: default; }
.cal { display: block; width: 100%; height: auto; margin-top: 8px; }
.cal text { fill: var(--ct-muted); font-size: 6px; }
.cal-d { fill: var(--ct-card-2); }
.cal-d.l1 { fill: color-mix(in srgb, var(--ct-blaze) 30%, var(--ct-card-2)); }
.cal-d.l2 { fill: color-mix(in srgb, var(--ct-blaze) 55%, var(--ct-card-2)); }
.cal-d.l3 { fill: color-mix(in srgb, var(--ct-blaze) 78%, var(--ct-card-2)); }
.cal-d.l4 { fill: var(--ct-blaze); }
.cal-d.future { opacity: .35; }
.cal rect.cal-d:not(.future):hover { stroke: var(--ct-fg); stroke-width: .7; }
.cal-legend { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 4px; font-size: .8em; color: var(--ct-muted); }
.cal-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--ct-card-2); }
.cal-legend i.l1 { background: color-mix(in srgb, var(--ct-blaze) 30%, var(--ct-card-2)); }
.cal-legend i.l2 { background: color-mix(in srgb, var(--ct-blaze) 55%, var(--ct-card-2)); }
.cal-legend i.l3 { background: color-mix(in srgb, var(--ct-blaze) 78%, var(--ct-card-2)); }
.cal-legend i.l4 { background: var(--ct-blaze); }
.cal-legend span { margin: 0 3px; }
.chart .base { stroke: var(--ct-line); }
.chart text { fill: var(--ct-muted); font-size: 10px; }
.section-title { margin: 16px 0 4px; font-weight: 600; display: flex; justify-content: space-between; }
.section-title span { color: var(--ct-muted); font-weight: 400; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
.badge { display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; align-items: center; padding: 8px; border-radius: 8px; background: var(--ct-card); }
.badge .medal { grid-row: span 2; width: 34px; height: 34px; }
.badge .n { font-weight: 600; line-height: 1.2; }
.badge .d { color: var(--ct-muted); font-size: .84em; line-height: 1.25; }
.badge.locked .n { color: var(--ct-muted); font-weight: 500; }

.actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.primary { background: var(--ct-btn-bg); color: var(--ct-btn-fg); border: 0; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.primary:hover { background: var(--ct-btn-hover); }
.link { background: none; border: 0; padding: 0; color: var(--ct-link); cursor: pointer; }
.link:hover { text-decoration: underline; }
.empty { padding: 18px 0 4px; }
.empty h1 { margin: 0 0 6px; font-size: 1.3em; }
.empty p { margin: 0 0 14px; color: var(--ct-muted); max-width: 36em; }
.finished-banner { margin: 10px 0 0; padding: 10px 12px; border-radius: 8px; text-align: center;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ct-blaze) 22%, transparent), color-mix(in srgb, var(--ct-good) 18%, transparent)); }
.finished-banner b { color: var(--ct-blaze); }
/* routes from the site */
.site-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.site-filters .search { display: flex; gap: 6px; width: 100%; }
.site-filters input[type=search] { flex: 1; min-width: 0; }
.site-filters select, .site-filters input { background: var(--ct-card-2); color: var(--ct-fg); border: 1px solid var(--ct-line); border-radius: 6px; padding: 5px 7px; font: inherit; }
.site-list { display: flex; flex-direction: column; gap: 10px; }
.site-card { display: grid; grid-template-columns: 96px 1fr; gap: 10px; background: var(--ct-card); border: 1px solid var(--ct-line); border-radius: 8px; padding: 8px; }
.site-card .cover { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--ct-card-2); }
.site-card .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.site-card .title { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.site-card .by, .site-card .facts, .site-card .meta, .site-card .tags { font-size: .86em; color: var(--ct-muted); }
.site-card .meta { display: flex; gap: 10px; } .site-card .meta .langs { margin-left: auto; }
.site-card .tags { color: var(--ct-blaze); }
.site-card .row { display: flex; gap: 10px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.site-card .badge { font-size: .72em; padding: 1px 6px; border-radius: 999px; color: #fff; background: #4f9d69; } .site-card .badge.story { background: #8a6fd1; }
.site-card .error { color: #d0574b; font-size: .86em; }
.site-state { font-size: .88em; color: var(--ct-muted); } .site-state.ok { color: #4f9d69; font-weight: 600; } .site-actions { display: flex; gap: 8px; align-items: center; }
.site-pages { display: flex; justify-content: space-between; align-items: center; }
.site .privacy { margin-top: 12px; font-size: .8em; }

    const NICE = [10, 20, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000, 100000, 200000, 250000, 500000, 1000000];
    function updateScale() {
      const unitPx = (box.clientWidth / W) * s;      // screen pixels per map unit at this zoom
      if (!unitPx) return;
      const mPerPx = geo.mPerUnit / unitPx;         // real meters per screen pixel
      const niceM = NICE.find(v => v / mPerPx >= 48) || NICE[NICE.length - 1];

      world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      // the same view for the vector layer, through its viewBox

      view.x1 = view.x0 + W / s; view.y1 = view.y0 + H / s;
      svg.setAttribute("viewBox", `${view.x0.toFixed(3)} ${view.y0.toFixed(3)} ${(W / s).toFixed(3)} ${(H / s).toFixed(3)}`);

    const zoomAt = (cx, cy, ns) => { ns = clamp(ns, 1, MAX_ZOOM); tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns; apply(); };
    box.addEventListener("wheel", e => { e.preventDefault(); const r = box.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, s * Math.exp(-e.deltaY * 0.0022)); }, { passive: false });

    box.addEventListener("pointerdown", e => { if (ctl.contains(e.target) || e.target.closest(".pin, .danger-pin")) return; drag = [e.clientX, e.clientY]; box.setPointerCapture(e.pointerId); box.classList.add("dragging"); });

  // ================================================================ hike
  // A postcard to share: the real hike scene, drawn off screen at double
  // density, with the place on top and the route, day and distance below.
  // 1200×630 is the size social networks use for link previews.
  async function postcard(j) {
    const PW = 1200, PH = 630, SH = 540;
    const host = el("div", { class: "scene", style: "position:fixed;left:-10000px;top:0;width:600px;height:270px" });
    document.body.append(host);
    try {
      HikeScene(host, j, { from: j.distance_m, avatar: data.avatar, team: [], assets: assetsFor(j.route.id), lockAhead: true, dpr: 2, onView: () => {} });
      for (let k = 0; k < 3; k++) await new Promise(r => requestAnimationFrame(r));
      await new Promise(r => setTimeout(r, 250)); // the hiker sprite and pictures load asynchronously
      const out = el("canvas"); out.width = PW; out.height = PH;
      const c = out.getContext("2d");
      c.fillStyle = "#16191c"; c.fillRect(0, 0, PW, PH);
      for (const cv of host.querySelectorAll("canvas")) c.drawImage(cv, 0, 0, PW, SH);
      const font = (w, px) => `${w} ${px}px ${getComputedStyle(document.body).fontFamily || "sans-serif"}`;
      // where you are
      const w = j.last_waypoint;
      const place = w ? w.name : t("startPlace"); // the last stop passed; the current altitude goes below
      c.font = font(600, 26);
      const pw = c.measureText(place).width + 36;
      c.fillStyle = "rgba(14,16,18,.62)";
      c.beginPath(); c.roundRect(28, 28, pw, 48, 24); c.fill();
      c.fillStyle = "#f3efe4"; c.textBaseline = "middle"; c.fillText(place, 46, 53);
      // the band: progress, route, day and distance, brand
      c.fillStyle = "#1b1f22"; c.fillRect(0, SH, PW, PH - SH);
      c.fillStyle = "#2c3236"; c.fillRect(0, SH, PW, 6);
      c.fillStyle = "#e8b53d"; c.fillRect(0, SH, PW * Math.min(1, j.distance_m / j.route.length_m), 6);
      c.textBaseline = "alphabetic";
      c.fillStyle = "#f3efe4"; c.font = font(700, 30); c.fillText(j.route.name, 40, SH + 46);
      c.fillStyle = "#aab1b3"; c.font = font(400, 22);
      c.fillText([t("dayN", { n: j.day || 1 }), t("ofTotal", { a: fmt(j.distance_m), b: fmt(j.route.length_m) }),
        j.elevation_m != null ? "⛰ " + fmtElev(j.elevation_m) : null].filter(Boolean).join(" · "), 40, SH + 78);

      return out.toDataURL("image/png");
    } finally {
      host.remove();
    }
  }

  /** Puts the picture into the clipboard: the browser's clipboard if it may, else the host's. */
  async function copyImage(dataUrl) {
    try {
      // not fetch(dataUrl): the panel's CSP allows no connections at all
      const bin = atob(dataUrl.slice(dataUrl.indexOf(",") + 1));
      const bytes = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      const blob = new Blob([bytes], { type: "image/png" });
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      return true;
    } catch (e) {
      send({ command: "copyImage", data: dataUrl }); // JetBrains copies it; VS Code saves it next to a note
      return false;
    }
  }

          el("div", { class: "masto" }, [server, el("button", { class: "chip-btn", "data-net": "mastodon", text: t("shareGo"), onclick: () => {
            const host = server.value.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
            if (!MASTODON_SERVER.test(host)) { server.focus(); return; }

  function hikeView(j, s) {
    const key = scope + ":" + j.route.id;
    const from = lastDrawn[key] != null ? Math.min(lastDrawn[key], j.distance_m) : j.distance_m;
    lastDrawn[key] = j.distance_m;
    const team = teamFor(j);

    const scene = el("div", { class: "scene", tabindex: "0", role: "img", "aria-label": j.route.name + ": " + fmt(j.distance_m) + " / " + fmt(j.route.length_m) + ". " + t("scrollHint") });
    const km = j.distance_m >= 1000;
    const value = km ? j.distance_m / 1000 : Math.round(j.distance_m);
    const digits = km && value < 100 ? 1 : 0;
    const shown = digits ? value.toFixed(1).replace(".", t("decimal")) : String(Math.round(value));
    const w = j.last_waypoint, st = j.story;
    const flavor = st && (!w || st.at_m >= w.at_m) ? st.text : (w && w.text) || "";

    let next = null;
    if (!j.finished && j.next_waypoint) {
      const prevAt = w ? w.at_m : 0, span = Math.max(1, j.next_waypoint.at_m - prevAt);
      const k = clamp((j.distance_m - prevAt) / span, 0, 1);
      next = el("div", { class: "next" }, [
        el("div", { class: "row" }, [el("span", {}, [t("nextStop") + ": ", el("b", { text: j.next_waypoint.name })]), el("span", { text: t("toGo", { d: fmt(j.to_next_m || 0) }) })]),
        el("div", { class: "bar thin" }, [el("i", { style: `width:${(k * 100).toFixed(1)}%` })]),
        j.elevation_m != null ? el("div", { class: "row", style: "margin-top:4px" }, [
          el("span", { class: "climb", text: j.to_next_climb_m > 0 ? t("climbLeft", { d: fmtElev(j.to_next_climb_m) }) : t("descentLeft") }),
          j.next_waypoint.elevation_m ? el("span", { text: fmtElev(j.next_waypoint.elevation_m) }) : null]) : null,
      ]);
    }
    const pills = el("div", { class: "pills" }, [
      el("span", {}, [t("today") + " ", el("b", { text: fmt(s.today_m || 0) })]),
      j.streak_days ? el("span", {}, ["🔥 ", el("b", { text: plural("days", j.streak_days) })]) : null,
      j.elevation_m != null ? el("span", {}, ["⛰ ", el("b", { text: fmtElev(j.elevation_m) })]) : null,
      j.ascent_m ? el("span", {}, ["↑ ", el("b", { text: fmtElev(j.ascent_m) })]) : null,
      !j.finished && s.typical_day_m ? el("span", { title: t("daysLeft", { n: daysLeft(j, s) }) }, ["⏳ ", el("b", { text: t("daysLeftShort", { n: daysLeft(j, s) }) })]) : null,
    ]);
    const info = el("div", { class: "hike-info" }, [
      el("div", { class: "day", text: t("dayN", { n: j.day || 1 }) }),
      el("div", { class: "big", text: shown }),
      el("div", { class: "unit", text: plural(km ? "kmWord" : "mWord", value, digits).replace(/^[\d.,\s]+/, "") }),
      el("div", { class: "place", text: w ? w.name : t("startPlace") }),
      flavor ? el("div", { class: "flavor", text: flavor }) : null,
      j.finished ? el("div", { class: "next", style: "text-align:center;color:#e8b53d", text: t("completed") }) : next,
      pills,
    ]);
    let sceneApi = null;
    const lock = !data.dev;
    const strip = ProfileStrip(j, team, m => sceneApi && sceneApi.lookAt(m), lock ? j.distance_m : null);
    const card = el("div", { class: "hike" }, [scene, strip.node, info]);
    const share = shareButton({ picture: () => postcard(j), text: () => shareText(j), name: `commit-hike-${j.route.id}-day-${j.day || 1}.png` });
    root.append(card, el("div", { class: "hike-actions" }, [el("p", { class: "hint", text: lock ? t("scrollHintLocked") : t("scrollHint") }), share.node]), share.note);
    const mini = MiniMap(j, { team, assets: assetsFor(j.route.id), width: root.clientWidth < 320 ? 70 : 84,
      onOpen: () => { view = "map"; remember({ view }); render(); } });
    scene.style.setProperty("--mm-h", mini.height + "px");
    // a camp when today has no commits yet (on a day off it's a rest, not a stop)
    const camp = !j.finished && (s.today_m || 0) === 0;
    const restDay = (s.rest_days || []).includes(new Date().getDay());
    sceneApi = HikeScene(scene, j, { from, avatar: data.avatar, team, assets: assetsFor(j.route.id), lockAhead: lock, dev: !!data.dev, camp, restDay,
      onView: (a, bM, hm) => { strip.view(a, bM, hm); mini.set(hm); } });
    scene.append(mini.node);
    const fc = factCard(j);
    if (fc) root.append(fc);
  }

  // ================================================================ map
  function mapView(j) {
    const holder = el("div");
    const show = f => { pickedFact = f; const c = factCard(j, f); holder.replaceChildren(...(c ? [c] : [])); if (c) c.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); };
    const showDanger = dg => { const c = el("div", { class: "card danger" }, [el("h3", { text: "⚠ " + t("danger") }), el("p", { text: dg.text }), el("p", { class: "from", text: fmt(dg.at_m) })]); holder.replaceChildren(c); };
    const m = MapView(j, { team: teamFor(j), assets: assetsFor(j.route.id), onFact: show, onDanger: showDanger });
    root.append(m.node, m.legend, el("p", { class: "hint", text: t("mapHint") }), holder);
    const c = factCard(j, pickedFact) || storyCard(j);
    if (c) holder.append(c);
  }

  // ================================================================ places
  // ================================================================ passport
  // A stamp for every stop reached on every trail, current and past, with the
  // date of the commit that got there.
  let placesMode = saved.placesMode || "trail";
  function placesToggle(s) {
    const n = (s.passport || []).length;
    const opt = (v, text) => el("button", { role: "radio", "aria-checked": String(placesMode === v), class: placesMode === v ? "on" : null,
      onclick: () => { if (placesMode !== v) { placesMode = v; remember({ placesMode: v }); render(); } } }, [text]);
    return el("div", { class: "choice places-mode", role: "radiogroup", "aria-label": t("tabPlaces") },
      [opt("trail", t("thisTrail")), opt("passport", "🎫 " + t("passport") + (n ? " · " + n : ""))]);
  }
  const STAMP_ICON = { peak: "▲", pass: "⛰", lake: "≈", river: "≈", spring: "≈", hut: "⌂", village: "⌂", start: "●", finish: "⚑",
    bridge: "⌒", landmark: "◆", cave: "◗", lighthouse: "♜" };
  function passportView(s) {
    const stamps = s.passport || [];
    if (!stamps.length) { root.append(el("p", { class: "hint", text: t("passportEmpty") })); return; }
    const byRoute = new Map();
    for (const st of stamps) {
      if (!byRoute.has(st.route_id)) byRoute.set(st.route_id, []);
      byRoute.get(st.route_id).push(st);
    }
    // the trails being walked now first, then the others by their latest stamp
    const current = new Set([s.global, s.project].filter(Boolean).map(j => j.route.id));
    const latest = list => list[list.length - 1].reached_at;
    const routes = [...byRoute.entries()].sort((a, b) => (current.has(b[0]) - current.has(a[0])) || latest(b[1]) - latest(a[1]));
    for (const [id, list] of routes) {
      const total = (s.route_stops || {})[id] || list.length, done = list.length >= total;
      root.append(el("div", { class: "pass-head" }, [
        el("span", { class: "nm", text: list[0].route_name }),
        el("span", { class: "meta", text: (done ? "✓ " : "") + t("passportCount", { n: list.length, m: total }) })]));
      root.append(el("div", { class: "stamps", role: "list" }, list.map(st => {
        const date = new Date(st.reached_at * 1000).toLocaleDateString(lang, { day: "numeric", month: "short", year: "numeric" });
        const rot = Math.round((hash(strSeed(id + st.waypoint_id), 9) - 0.5) * 14);
        return el("div", { class: "stamp", role: "listitem", style: `--h:${hue(id)};--r:${rot}deg`,
          "aria-label": `${st.name}, ${date}`, title: st.elevation_m ? `${st.name} · ${fmtElev(st.elevation_m)}` : st.name }, [
          el("span", { class: "ic", text: STAMP_ICON[st.kind] || "●" }),
          el("span", { class: "nm", text: st.name }),
          el("span", { class: "dt", text: date })]);
      })));
    }
  }

  function placesView(j) {
    const rm = RouteModel(j.route), d = j.distance_m, assets = assetsFor(j.route.id);
    const items = [];
    for (const w of j.route.waypoints || []) items.push({ kind: "wp", at: w.at_m, w });
    for (const f of j.route.facts || []) items.push({ kind: "fact", at: f.at_m, f });
    for (const o of j.route.objects || []) if (o.caption) items.push({ kind: "obj", at: o.at_m, o });
    for (const g of j.route.dangers || []) items.push({ kind: "danger", at: g.at_m, g });
    for (const u of j.route.underground || []) items.push({ kind: "ug", at: u.from_m, text: t("intoTunnels"), len: u.to_m - u.from_m }, { kind: "ug", at: u.to_m, text: t("backToDaylight") });
    items.sort((a, b) => a.at - b.at || (a.kind === "wp" ? -1 : 1));
    const list = el("ol", { class: "places" });
    let hereShown = false, prevWp = null;
    const here = () => el("li", { class: "here" }, [el("span", { class: "dot" }),
      el("div", { class: "row" }, [el("span", { class: "nm", text: t("here") }), el("span", { class: "meta", text: fmt(d) + (j.elevation_m != null ? " · " + fmtElev(j.elevation_m) : "") })])]);
    for (const it of items) {
      const passed = it.at <= d;
      if (!passed && !hereShown) { list.append(here()); hereShown = true; }
      const meta = passed ? t("passedAt", { d: fmt(it.at) }) : t("left", { d: fmt(it.at - d) });
      if (it.kind === "wp") {
        const w = it.w;
        if (prevWp && rm.hasElev) {
          const a = rm.ascentBetween(prevWp.at_m, w.at_m);
          if (a.up >= 5 || a.down >= 5) list.append(el("li", { class: "seg", "aria-hidden": "true" }, [
            el("span", { class: "u", text: "↑ " + fmtElev(a.up) }), "  ↓ " + fmtElev(a.down)]));
        }
        prevWp = w;
        list.append(el("li", { class: passed ? "passed" : "" }, [
          el("span", { class: "dot", text: passed ? "✓" : "" }),
          el("div", { class: "row" }, [el("span", { class: "nm", text: w.name + (w.elevation_m ? ", " + fmtElev(w.elevation_m) : "") }), el("span", { class: "meta", text: meta })]),
          passed && w.text ? el("div", { class: "txt", text: w.text }) : null,
        ]));
      } else if (it.kind === "fact") {
        list.append(el("li", { class: "fact" + (passed ? " passed" : "") }, [
          el("span", { class: "dot" }),
          el("div", { class: "row" }, [el("span", { class: "meta", text: "ℹ " + t("factTitle") }), el("span", { class: "meta", text: meta })]),
          el("div", { class: "txt", text: passed ? it.f.text : "• • •" }),
        ]));
      } else if (it.kind === "danger") {
        list.append(el("li", { class: "fact danger" + (passed ? " passed" : "") }, [
          el("span", { class: "dot" }),
          el("div", { class: "row" }, [el("span", { class: "meta", text: "⚠ " + t("danger") }), el("span", { class: "meta", text: meta })]),
          el("div", { class: "txt", text: passed ? it.g.text : "• • •" }),
        ]));
      } else if (it.kind === "ug") {
        list.append(el("li", { class: "ug" + (passed ? " passed" : "") }, [
          el("span", { class: "dot" }),
          el("div", { class: "row" }, [el("span", { class: "nm", text: "⛏ " + it.text + (it.len ? " · " + fmt(it.len) : "") }), el("span", { class: "meta", text: meta })]),
        ]));
      } else if (passed) {
        const src = assets && assets.images && assets.images[it.o.asset];
        list.append(el("li", { class: "obj passed" }, [el("span", { class: "dot" }),
          el("div", { class: "row" }, [el("span", {}, [src ? el("img", { class: "th", src, alt: "" }) : null, it.o.caption]), el("span", { class: "meta", text: meta })])]));
      }
    }
    if (!hereShown && !j.finished) list.append(here());
    root.append(list);
    if (j.next_route && !j.finished) root.append(el("p", { class: "hint series-hint", text: t("seriesAfter", { s: j.next_route.series_name, name: j.next_route.name }) }));
  }

  // ================================================================ team
  // ================================================================ the team's week and goal
  const shortDate = iso => new Date(iso + "T00:00:00Z").toLocaleDateString(lang, { day: "numeric", month: "short", timeZone: "UTC" });
  const memberColor = m => m.me ? "var(--ct-blaze)" : `hsl(${hue(m.id)},55%,50%)`;

  function teamWeekCard(w) {
    const card = el("div", { class: "card team-week" }, [el("h3", { text: t("weekTitle") + " · " + shortDate(w.from) + " – " + shortDate(w.to) })]);
    if (!w.commits) {
      card.append(el("p", { class: "from", text: t("weekEmpty") }));
      if (w.prev_total_m) card.append(el("p", { class: "from", text: t("weekLast", { d: fmt(w.prev_total_m) }) }));
      return card;
    }
    let trend = null;
    if (w.prev_total_m > 0) {
      const p = Math.round((w.total_m - w.prev_total_m) / w.prev_total_m * 100);
      trend = el("span", { class: "trend " + (p >= 0 ? "up" : "down"), text: t(p >= 0 ? "weekUp" : "weekDown", { p: Math.abs(p) }) });
    }
    card.append(el("p", {}, [el("span", { class: "big", text: fmt(w.total_m) }), trend]),
      el("p", { class: "from", text: [plural("commitsN", w.commits), t("weekDays", { n: w.active_days, m: w.days_elapsed }),
        w.best_day ? t("weekBest", { day: new Date(w.best_day + "T00:00:00Z").toLocaleDateString(lang, { weekday: "long", timeZone: "UTC" }), d: fmt(w.best_day_m) }) : null,
      ].filter(Boolean).join(" · ") }));
    const max = Math.max(...w.members.map(m => m.distance_m), 1);
    const rows = el("div", { class: "week-rows" });
    for (const m of w.members) {
      rows.append(el("span", { class: "nm" + (m.me ? " me" : ""), title: m.name, text: m.me ? `${m.name} (${t("you")})` : m.name }),
        el("div", { class: "bar thin" }, [el("i", { style: `width:${(m.distance_m / max * 100).toFixed(1)}%;background:${memberColor(m)}` })]),
        el("span", { class: "d", text: fmt(m.distance_m) }));
    }
    card.append(rows);
    if (w.hidden) card.append(el("p", { class: "from", text: t("teamMore", { n: w.hidden }) }));
    return card;
  }

  function goalPicker(routes, current, label) {
    const select = el("select", { "aria-label": t("goalRoute") }, routes.map(r =>
      el("option", { value: r.id, selected: r.id === current ? true : null, text: `${r.name} · ${fmt(r.length_m)}` })));
    return el("div", { class: "goal-pick" }, [select,
      el("button", { class: "chip-btn", text: label, onclick: () => send({ command: "setTeamGoal", route: select.value }) })]);
  }

  function teamGoalCard(tm) {
    const g = tm.goal, routes = tm.routes || [];
    if (!g) {
      return el("div", { class: "card team-goal" }, [el("h3", { text: t("goalTitle") }), el("p", { text: t("goalNone") }),
        routes.length ? goalPicker(routes, null, t("goalStart")) : null, el("p", { class: "from", text: t("goalNote") })]);
    }
    const bar = el("div", { class: "goal-bar", role: "img", "aria-label": t("goalTogether", { a: fmt(g.distance_m), b: fmt(g.length_m) }) });
    for (const m of g.members) bar.append(el("i", { title: `${m.name}: ${fmt(m.distance_m)}`, style: `width:${Math.min(100, m.distance_m / g.length_m * 100).toFixed(2)}%;background:${memberColor(m)}` }));
    const facts = g.finished ? [t("goalDone")] : [
      g.next_waypoint ? t("goalNext", { name: g.next_waypoint.name, d: fmt(g.to_next_m || 0) }) : null,
      g.pace_m ? t("goalPace", { d: fmt(g.pace_m) }) : null,
      g.days_left ? t("goalLeft", { n: g.days_left }) : null,
    ].filter(Boolean);
    let changing = null;
    const card = el("div", { class: "card team-goal" }, [
      el("h3", { text: t("goalTitle") + " · " + t("goalSince", { date: new Date(g.since * 1000).toLocaleDateString(lang, { day: "numeric", month: "short" }) }) }),
      el("p", {}, [el("b", { text: g.route_name }), " — " + t("goalTogether", { a: fmt(g.distance_m), b: fmt(g.length_m) }) + ` (${String(g.percent).replace(".", t("decimal"))}%)`]),
      bar,
      el("div", { class: "goal-legend" }, g.members.map(m => el("span", { style: `--sw:${memberColor(m)}`, text: `${m.me ? t("you") : m.name} ${fmt(m.distance_m)}` }))),
      facts.length ? el("p", { class: "from", text: facts.join(" · ") }) : null,

        el("button", { class: "link", text: t("goalChange"), onclick: () => {

      ]),
      el("p", { class: "from", text: t("goalNote") }),
    ]);
    return card;
  }

  function teamView(j, s) {
    if (!data.repo) return root.append(el("div", { class: "card" }, [el("p", { text: t("teamNoRepo") })]));
    if (!s.team) {
      return root.append(el("div", { class: "card" }, [
        el("h3", { text: t("teamTitle") }), el("p", { text: t("teamText") }),
        el("p", { class: "from", text: t("teamPrivacy") }),
        el("div", { class: "actions", style: "margin-top:10px" }, [el("button", { class: "primary", text: t("teamOn"), onclick: () => send({ command: "setTeam", on: true }) })]),
      ]));
    }
    const tm = data.team;
    if (data.team_error) root.append(el("div", { class: "card" }, [el("p", { text: data.team_error })]));
    else if (!tm) { root.append(el("p", { class: "hint", text: t("teamLoading") })); send({ command: "requestTeam" }); }
    else {
      const routeName = tm.route_id === j.route.id ? j.route.name : ((data.status.project && data.status.project.route.id === tm.route_id && data.status.project.route.name) ||
        (data.status.global && data.status.global.route.id === tm.route_id && data.status.global.route.name) || tm.route_id);
      root.append(el("p", { class: "hint", style: "margin-top:0", text: tm.route_id === j.route.id ? t("teamRoute", { name: routeName }) : t("teamOtherRoute", { name: routeName }) }));
      if (tm.week) root.append(teamWeekCard(tm.week));
      root.append(teamGoalCard(tm));
      const members = tm.members || [];
      const me = members.findIndex(m => m.me);

          el("span", { class: "nm", title: m.name }, [m.name, m.me ? el("small", { text: "(" + t("you") + ")" }) : null]),
          el("span", { class: "dist", text: fmt(m.distance_m) }),
          el("div", { class: "bar thin" }, [el("i", { style: `width:${clamp(m.percent, 0, 100)}%;${m.me ? "" : `background:hsl(${h},55%,50%)`}` })]),
          el("div", { class: "sub" }, [
            el("span", { text: plural("commitsN", m.commits) }),
            m.today_m ? el("span", { text: t("todayShort", { d: fmt(m.today_m) }) }) : null,
            m.elevation_m != null ? el("span", { text: "⛰ " + fmtElev(m.elevation_m) }) : null,

          ]),
        ]));
      });
      root.append(list);
      if (tm.hidden) root.append(el("p", { class: "hint", text: t("teamMore", { n: tm.hidden }) }));
    }
    root.append(el("p", { class: "hint", text: t("teamPrivacy") }),
      el("div", { class: "actions" }, [el("button", { class: "link", text: t("teamOff"), onclick: () => send({ command: "setTeam", on: false }) })]));
  }

  // ================================================================ stats
  // Last 14 days. Hovering (or focusing, or tapping) a day shows its date and

      select("sort", t("siteSort"), ["popular", "new", "rating", "short", "long"].map(k => [k, t("siteSort_" + k)])),
    ]);
    const list = el("div", { class: "site-list", "aria-live": "polite" });
    const r = site.result;
    if (site.error) {
      const offline = site.error.code === "site_unreachable";
      list.append(el("div", { class: "empty-state" }, [el("p", { text: offline ? t("siteOffline") : (site.error.message || t("unknownError")) }),
        el("button", { class: "chip-btn primary", text: t("retry"), onclick: () => siteSearch(site.query.page) })]));
    } else if (site.loading && !r) list.append(el("p", { class: "hint", text: t("siteLoading") }));
    else if (r) {
      list.append(el("p", { class: "hint", text: site.loading ? t("siteLoading") : t("siteCount", { n: r.total }) }));
      if (!r.routes.length) list.append(el("p", { class: "hint", text: t("siteEmpty") }));
      r.routes.forEach(x => list.append(siteCard(x)));
      if (r.pages > 1) list.append(el("div", { class: "site-pages" }, [
        r.page > 1 ? el("button", { class: "link", text: t("sitePrev"), onclick: () => siteSearch(r.page - 1) }) : el("span"),
        el("span", { class: "hint", text: t("sitePage", { p: r.page, n: r.pages }) }),
        r.page < r.pages ? el("button", { class: "link", text: t("siteNext"), onclick: () => siteSearch(r.page + 1) }) : el("span")]));
    }
    root.append(el("div", { class: "settings site" }, [
      el("div", { class: "settings-head" }, [back, el("h2", { text: t("siteTitle") })]),
      filters, list,
      el("p", { class: "hint privacy", text: t("sitePrivacy", { site: (r && r.site || "commit-hike.dev").replace(/^https?:\/\//, "") }) })]));
    if (!site.loading) q.focus();
  }

  function settingsView() {
    const s = data.status || {}, set = s.settings || {};
    const ls = data.locale_setting || {};
    const seg = (label, options, current, onPick) => el("div", { class: "choice", role: "radiogroup", "aria-label": label },
      options.map(([v, text]) => el("button", { role: "radio", "aria-checked": String(v === current), class: v === current ? "on" : null,
        onclick: () => { if (v !== current) onPick(v); } }, [text])));
    const row = (title, hint, ...controls) => el("section", { class: "set-row" },
      [el("h3", { text: title }), hint ? el("p", { class: "set-h", text: hint }) : null, ...controls]);
    const auto3 = [["auto", t("optAuto")], ["on", t("optOn")], ["off", t("optOff")]];

    const langs = [...new Set(["en", "uk", ...(ls.available || [])])].filter(l => STRINGS[l] || LANG_NAMES[l]);
    const perLevel = lvl => (s.typical_day_m || 0) / (LEVEL_FACTOR[s.difficulty] || 1) * LEVEL_FACTOR[lvl];
    const rest = s.rest_days || [];
    const restBtns = [1, 2, 3, 4, 5, 6, 0].map(d => {
      const on = rest.includes(d), lastWorking = !on && rest.length === 6;
      return el("button", { class: on ? "on" : null, "aria-pressed": String(on), disabled: lastWorking ? "" : null,
        title: lastWorking ? t("restAllDays") : weekdayName(d, "long"),
        onclick: () => send({ command: "setRestDays", days: on ? rest.filter(x => x !== d) : [...rest, d] }) }, [weekdayName(d)]);
    });

    root.append(el("div", { class: "settings" }, [
      el("div", { class: "set-head" }, [
        el("button", { class: "link", text: "← " + t("back"), onclick: () => { view = viewBeforeSettings && viewBeforeSettings !== "settings" ? viewBeforeSettings : "hike"; render(); } }),
        el("h2", { text: t("settings") })]),
      row(t("language"), null, seg(t("language"), [["auto", t("langAuto")], ...langs.map(l => [l, LANG_NAMES[l] || l])], ls.locale || "auto",
        v => send({ command: "setLocale", locale: v }))),
      s.difficulty ? row(t("difficulty"), t("diffHint"), seg(t("difficulty"), ["easy", "medium", "hard"].map(l =>
        [l, (STRINGS[lang].diff || STRINGS.en.diff)[l] + " · " + t("perDay", { d: fmt(perLevel(l)) })]), s.difficulty,
        v => send({ command: "setDifficulty", level: v }))) : null,
      row(t("setRest"), t("setRestHint"), el("div", { class: "choice days", role: "group", "aria-label": t("setRest") }, restBtns)),
      row(t("setNotif"), t("setNotifHint"), seg(t("setNotif"), [["all", t("notifAll")], ["milestones", t("notifMilestones")], ["off", t("notifOff")]],
        set.notifications || "all", v => send({ command: "setSettings", notifications: v }))),
      row(t("setMotion"), t("setMotionHint"), seg(t("setMotion"), auto3, set.reduce_motion || "auto", v => send({ command: "setSettings", reduce_motion: v }))),
      row(t("setContrast"), t("setContrastHint"), seg(t("setContrast"), auto3, set.high_contrast || "auto", v => send({ command: "setSettings", high_contrast: v }))),
      row(t("setHiker"), null, el("div", { class: "set-btns" }, [
        el("button", { class: "chip-btn", text: t("changeIcon"), onclick: () => send({ command: "setAvatar" }) }),
        data.avatar_custom ? el("button", { class: "chip-btn", text: t("resetIcon"), onclick: () => send({ command: "resetAvatar" }) }) : null])),
      row(t("setBackup"), t("setBackupHint"), el("div", { class: "set-btns" }, [
        el("button", { class: "chip-btn", text: t("backupExport"), onclick: () => send({ command: "exportProgress" }) }),
        el("button", { class: "chip-btn", text: t("backupImport"), onclick: () => send({ command: "importProgress" }) })])),
      row(t("setHelp"), t("setHelpHint"), el("div", { class: "set-btns" }, [
        el("button", { class: "chip-btn", text: t("copyReport"), onclick: () => send({ command: "copyDiagnostics" }) })])),
    ]));
  }

  function render() {
    if (!data) return;
    lang = pickLang((data.locale_setting && data.locale_setting.effective) || data.locale || (data.status && data.status.locale));
    document.documentElement.lang = lang;
    root.replaceChildren();
    if (data.state === "not_initialized") return emptyView(t("setupTitle"), t("setupText"), t("setupBtn"), { command: "setup" });
    if (data.state === "error") return emptyView(t("errorTitle"), data.error || t("unknownError"), t("retry"), { command: "refresh" });

    const s = data.status || {};
    if (!data.repo) scope = "global";
    const j = scope === "project" ? s.project : s.global;
    root.append(header(j));
    if (menuOpen) root.append(menu(j));
    if (view === "settings") return settingsView();
    if (view === "site") return siteView();
    if (scope === "project" && !s.tracked) return emptyView(t("notCountedTitle"), t("notCountedText"), t("countBtn"), { command: "enableProject" });
    if (scope === "project" && !s.project) return emptyView(t("noProjectTitle"), t("noProjectText"), t("chooseTrail"), { command: "chooseRoute", scope: "project" });
    if (!j || !j.route) return emptyView(t("noTrailTitle"), t("noTrailText"), t("chooseTrail"), { command: "chooseRoute", scope });

    root.append(progressBlock(j));
    if (j.finished) root.append(el("div", { class: "finished-banner" }, [el("b", { text: "✓ " + t("completed") + ". " }), t("completedText", { d: fmt(j.route.length_m), name: j.route.name })]));
    // a finished route of a series: offer the next one
    if (j.finished && j.next_route) {
      const n = j.next_route;
      root.append(el("div", { class: "series-next" }, [
        el("span", { class: "k", text: t("seriesNext", { s: n.series_name }) }),
        el("button", { class: "chip-btn primary", text: t("walkOn", { name: n.name, d: fmt(n.length_m) }),
          onclick: () => send({ command: "walkRoute", id: n.id }) })]));
    }
    root.append(tabs());
    switch (view) {
      case "map": mapView(j); break;
      case "places":
        root.append(placesToggle(s));
        if (placesMode === "passport") passportView(s); else placesView(j);
        break;
      case "team": teamView(j, s); break;
      case "stats": statsView(j, s); break;
      default: hikeView(j, s);
    }
    root.append(el("div", { class: "actions" }, [
      el("button", { class: "link", text: j.finished ? t("startNew") : t("changeTrail"), onclick: () => send({ command: "chooseRoute", scope }) }),
      el("button", { class: "link", text: "🌐 " + t("siteLink"), onclick: openSite }),
    ]));
  }

  document.addEventListener("click", () => { if (menuOpen) { menuOpen = false; render(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && menuOpen) { menuOpen = false; render(); } });

  let openToken = null, viewBeforeSettings = null;
  function update(next) {
    data = next;
    if (next && next.open_view && next.open_token !== openToken) {
      openToken = next.open_token;
      if ((next.open_view === "settings" || next.open_view === "site") && view !== next.open_view) viewBeforeSettings = view;
      view = next.open_view;
      if (view === "site" && !site.result && !site.loading) { site.query.page = 1; site.loading = true; send({ command: "siteSearch", query: { ...site.query } }); }
    }
    applyPrefs(); render();
  }
  const parse = d => (typeof d === "string" ? JSON.parse(d) : d);
  window.commitHike = { update: d => update(parse(d)), site: d => onSite(parse(d)) };
  window.addEventListener("message", e => {
    if (e.data && e.data.type === "update") update(e.data);
    else if (e.data && e.data.type === "site") onSite(e.data);
  });
  send({ command: "ready" });
})();
</script>
</body>
</html>
